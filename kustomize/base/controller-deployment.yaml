apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-workspaces-controller
  namespace: kube-workspaces-system
  labels:
    app.kubernetes.io/name: kube-workspaces
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-workspaces
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-workspaces
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: kube-workspaces-controller
      containers:
        - name: controller
          image: kubeworkspaces/controller:latest
          imagePullPolicy: Always
          args:
            - --leader-elect
            - --metrics-bind-address=:8080
            - --metrics-secure=false
          ports:
            - containerPort: 8081
              name: health
            - containerPort: 8080
              name: metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 64Mi
