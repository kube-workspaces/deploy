apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-workspaces-proxy
  namespace: kube-workspaces-system
  labels:
    app.kubernetes.io/name: kube-workspaces
    app.kubernetes.io/component: proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-workspaces
      app.kubernetes.io/component: proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-workspaces
        app.kubernetes.io/component: proxy
    spec:
      serviceAccountName: kube-workspaces-proxy
      # The legacy auto-mounted token is replaced with an explicit projected one:
      # it is short-lived and auto-rotated rather than long-lived, and the mount is
      # intentional and auditable rather than implicit. See docs/security.md.
      automountServiceAccountToken: false
      containers:
        - name: proxy
          image: ghcr.io/kube-workspaces/proxy:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          env:
            - name: ALLOWED_ORIGINS
              value: "https://workspaces.example.com,http://localhost:3000"
            - name: PATH_PREFIX
              value: "/proxy"
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: kube-api-access
          projected:
            defaultMode: 420
            sources:
              # No audience is set deliberately. The API server then issues the
              # token for its own default audience, which is what client-go's
              # in-cluster config expects. Hardcoding one risks mismatching the
              # cluster issuer (kubernetes.default.svc vs
              # kubernetes.default.svc.cluster.local) and failing authentication.
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
---
# ClusterIP service — accessed via nginx ingress only
apiVersion: v1
kind: Service
metadata:
  name: kube-workspaces-proxy
  namespace: kube-workspaces-system
  labels:
    app.kubernetes.io/name: kube-workspaces
    app.kubernetes.io/component: proxy
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: kube-workspaces
    app.kubernetes.io/component: proxy
