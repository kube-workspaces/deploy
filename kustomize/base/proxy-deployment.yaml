apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-workspaces-proxy
  namespace: kube-workspaces-system
  labels:
    app.kubernetes.io/name: kube-workspaces
    app.kubernetes.io/component: proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-workspaces
      app.kubernetes.io/component: proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-workspaces
        app.kubernetes.io/component: proxy
    spec:
      serviceAccountName: kube-workspaces-proxy
      containers:
        - name: proxy
          image: kubeworkspaces/proxy:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          env:
            - name: ALLOWED_ORIGINS
              value: "https://workspaces.fordham.id.au,http://localhost:3000"
            - name: PATH_PREFIX
              value: "/proxy"
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
---
# ClusterIP service — accessed via nginx ingress only
apiVersion: v1
kind: Service
metadata:
  name: kube-workspaces-proxy
  namespace: kube-workspaces-system
  labels:
    app.kubernetes.io/name: kube-workspaces
    app.kubernetes.io/component: proxy
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: kube-workspaces
    app.kubernetes.io/component: proxy
