apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-workspaces-proxy
  namespace: kube-workspaces-system
  labels:
    app.kubernetes.io/name: kube-workspaces
    app.kubernetes.io/component: proxy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-workspaces-proxy
  labels:
    app.kubernetes.io/name: kube-workspaces
    app.kubernetes.io/component: proxy
rules:
  # Read Image CRs to look up proxyConfig
  - apiGroups: ["kubeworkspaces.io"]
    resources: ["images"]
    verbs: ["list"]
  # Read Workspace CRs to resolve workspace name → container image
  - apiGroups: ["kubeworkspaces.io"]
    resources: ["workspaces"]
    verbs: ["get"]
  # Read AuthConfig CR to check if auth is enabled and get signing key reference
  - apiGroups: ["kubeworkspaces.io"]
    resources: ["authconfigs"]
    verbs: ["get"]
  # Read User CRs to check namespace access and disabled status
  - apiGroups: ["kubeworkspaces.io"]
    resources: ["users"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-workspaces-proxy
  labels:
    app.kubernetes.io/name: kube-workspaces
    app.kubernetes.io/component: proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-workspaces-proxy
subjects:
  - kind: ServiceAccount
    name: kube-workspaces-proxy
    namespace: kube-workspaces-system
---
# Role for reading Secrets in kube-workspaces-system (signing key)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-workspaces-proxy-secrets
  namespace: kube-workspaces-system
  labels:
    app.kubernetes.io/name: kube-workspaces
    app.kubernetes.io/component: proxy
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-workspaces-proxy-secrets
  namespace: kube-workspaces-system
  labels:
    app.kubernetes.io/name: kube-workspaces
    app.kubernetes.io/component: proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-workspaces-proxy-secrets
subjects:
  - kind: ServiceAccount
    name: kube-workspaces-proxy
    namespace: kube-workspaces-system
