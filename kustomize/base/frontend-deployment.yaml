apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-workspaces-frontend
  namespace: kube-workspaces-system
  labels:
    app.kubernetes.io/name: kube-workspaces
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-workspaces
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-workspaces
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: kubeworkspaces/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: API_URL
              value: http://kube-workspaces-api.kube-workspaces-system.svc.cluster.local:80
            - name: PROXY_URL
              value: http://kube-workspaces-proxy.kube-workspaces-system.svc.cluster.local:80
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kube-workspaces-frontend
  namespace: kube-workspaces-system
  labels:
    app.kubernetes.io/name: kube-workspaces
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: kube-workspaces
    app.kubernetes.io/component: frontend
