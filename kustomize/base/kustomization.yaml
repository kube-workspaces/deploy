apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - rbac.yaml
  - workspace-roles.yaml
  - controller-deployment.yaml
  - api-deployment.yaml
  - proxy-rbac.yaml
  - proxy-deployment.yaml
  - frontend-deployment.yaml
  - ingress.yaml

images:
  - name: kube-workspaces-api
    newName: ghcr.io/kube-workspaces/api
    newTag: latest
  - name: kube-workspaces-controller
    newName: ghcr.io/kube-workspaces/controller
    newTag: latest
  - name: kube-workspaces-frontend
    newName: ghcr.io/kube-workspaces/frontend
    newTag: latest
  - name: kube-workspaces-proxy
    newName: ghcr.io/kube-workspaces/proxy
    newTag: latest
