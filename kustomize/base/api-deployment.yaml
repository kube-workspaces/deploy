apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-workspaces-api
  namespace: kube-workspaces-system
  labels:
    app.kubernetes.io/name: kube-workspaces
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-workspaces
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-workspaces
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: kube-workspaces-controller
      containers:
        - name: api
          image: ghcr.io/kube-workspaces/api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          env:
            - name: EXTERNAL_HOST
              value: "api.workspaces.example.com"
            - name: AUTH_CALLBACK_URL
              value: "https://workspaces.example.com/auth/callback"
            - name: ALLOWED_ORIGINS
              value: "https://workspaces.example.com,http://localhost:3000"
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kube-workspaces-api
  namespace: kube-workspaces-system
  labels:
    app.kubernetes.io/name: kube-workspaces
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: kube-workspaces
    app.kubernetes.io/component: api
