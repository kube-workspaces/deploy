apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kube-workspaces
  namespace: kube-workspaces-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: traefik
  rules:
  - host: workspaces.example.com
    http:
      paths:
      # API paths that don't conflict with frontend page routes
      - path: /v1
        pathType: Prefix
        backend:
          service:
            name: kube-workspaces-api
            port:
              number: 80
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: kube-workspaces-api
            port:
              number: 80
      - path: /openapi
        pathType: Prefix
        backend:
          service:
            name: kube-workspaces-api
            port:
              number: 80
      - path: /proxy
        pathType: Prefix
        backend:
          service:
            name: kube-workspaces-proxy
            port:
              number: 80
      # Frontend catches everything else (including /admin, /workspaces, /volumes pages)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kube-workspaces-frontend
            port:
              number: 80
  - host: api.workspaces.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kube-workspaces-api
            port:
              number: 80
  tls:
  - hosts:
    - workspaces.example.com
    - api.workspaces.example.com
    secretName: kube-workspaces-tls
