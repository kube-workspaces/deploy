---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: sshkeys.kubeworkspaces.io
spec:
  group: kubeworkspaces.io
  names:
    kind: SshKey
    listKind: SshKeyList
    plural: sshkeys
    singular: sshkey
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.name
      name: Name
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SshKey is the Schema for the sshkeys API.
          It stores an SSH public key owned by a user. The workspace controller seeds
          the keys into VM guest cloud-init user-data so the guest's sshd trusts them
          (enabling passwordless SSH into VM workspaces). Keys live in the user's
          personal namespace and apply to every vm workspace created there.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SshKeySpec defines the desired state of SshKey.
            properties:
              name:
                description: Name is a human-friendly label for this key (e.g. "laptop-2025").
                type: string
              publicKey:
                description: PublicKey is the SSH public key line (e.g. "ssh-ed25519
                  AAAA... user@host").
                type: string
            required:
            - publicKey
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
