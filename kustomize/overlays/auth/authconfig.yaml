# AuthConfig CR - the singleton that enables authentication.
# Edit the values below to match your OIDC provider configuration.
apiVersion: kubeworkspaces.io/v1alpha1
kind: AuthConfig
metadata:
  name: default
spec:
  enabled: true
  oidc:
    issuerURL: "https://dex.example.com"       # CHANGEME: Your OIDC issuer URL
    clientID: "kube-workspaces"                 # CHANGEME: Your OAuth2 client ID
    clientSecret:
      name: "kube-workspaces-oidc"
      key: "client-secret"
    scopes:
      - "openid"
      - "email"
      - "profile"
    usernameClaim: "email"
  session:
    signingKey:
      name: "kube-workspaces-session"
      key: "signing-key"
    tokenExpiry: "24h"
    refreshExpiry: "7d"
  personalNamespaces:
    enabled: true
    template: "{{username}}"
  registration:
    autoProvision: true
    defaultRole: "editor"
    requireApproval: false
  adminEmails:
    - "admin@example.com"                       # CHANGEME: Your admin email(s)
  # To ALSO enable local (username/password) authentication alongside OIDC,
  # uncomment the block below. A default admin user is auto-created with a
  # randomly generated password (see docs/authentication.md for retrieval
  # instructions). Alternatively, see kustomize/overlays/auth-local/ for a
  # local-only setup with no OIDC provider required at all.
  # localAuth:
  #   enabled: true
  #   bootstrapAdmin:
  #     email: "admin@local"
  #     skip: false
