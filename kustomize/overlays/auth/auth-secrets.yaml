# Session signing key secret.
# In production, use a strong random value (at least 32 bytes).
# Generate with: openssl rand -base64 32
apiVersion: v1
kind: Secret
metadata:
  name: kube-workspaces-session
  namespace: kube-workspaces-system
type: Opaque
stringData:
  signing-key: "CHANGEME-generate-with-openssl-rand-base64-32"
---
# OIDC client secret.
# This must match the client secret configured in your OIDC provider (e.g. Dex).
apiVersion: v1
kind: Secret
metadata:
  name: kube-workspaces-oidc
  namespace: kube-workspaces-system
type: Opaque
stringData:
  client-secret: "CHANGEME-your-oidc-client-secret"
