# Session signing key secret. Sessions are always HMAC-signed regardless of
# the authentication method, so this is required even for local-only auth.
#
# Generate a strong random value before applying:
#   kubectl create secret generic kube-workspaces-session \
#     -n kube-workspaces-system \
#     --from-literal=signing-key="$(openssl rand -base64 32)"
#
# Or replace the placeholder below and apply with kustomize:
#   sed -i "s|CHANGEME.*|$(openssl rand -base64 32)|" session-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: kube-workspaces-session
  namespace: kube-workspaces-system
type: Opaque
stringData:
  signing-key: "CHANGEME-generate-with-openssl-rand-base64-32"
