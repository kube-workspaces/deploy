apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - authconfig.yaml
  - session-secret.yaml
  # NOTE: workspace-roles.yaml is NOT listed here — ../../base already
  # includes it. Duplicating it makes `kustomize build` fail with
  # "may not add resource with an already registered id".
