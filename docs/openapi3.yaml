                        - title: Docker Hub
                          url: https://hub.docker.com/r/codercom/code-server
                memory_limit:
                    type: string
                    example: Est eum non vitae.
                memory_request:
                    type: string
                    example: Sed debitis ratione ut sed.
                name:
                    type: string
                    description: Display name
