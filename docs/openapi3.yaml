                port: 8080
            required:
                - new_name
        ContainerInitDefaults:
            type: object
            properties:
                mode:
                    type: string
                    example: baked-in
                    enum:
                        - disabled
                        - injected
                        - baked-in
            description: Opt-in container initialization; omitted preserves ordinary image startup
            example:
                mode: baked-in
            required:
                - mode
        ContainerState:
            type: object
            properties:
                message:
                    type: string
                    description: Details about the state
                    example: Container started successfully
                reason:
                    type: string
                    description: Reason for the state
                    example: Started
                started_at:
                    type: string
                    description: Time the container started
                    example: "2025-01-02T15:04:05Z"
                state:
                    type: string
                    description: 'Current state: running, waiting, terminated'
                    example: running
                    enum:
                        - running
                        - waiting
                        - terminated
                        - unknown
            description: State of the workspace container
            example:
                message: Container started successfully
                reason: Started
                started_at: "2025-01-02T15:04:05Z"
                state: running
        CreateImagePayload:
            type: object
            properties:
                category:
                    type: string
                    description: Category for grouping (e.g. Desktop, IDE, Tool, Game)
                    example: IDE
                default_args:
                    type: array
                    items:
                        type: string
                        example: Ut ea accusamus labore.
                    description: Default command-line args
                    example:
                        - --bind-addr
                        - 0.0.0.0:8080
                default_cloud_init:
                    type: boolean
                    description: Set to true when the image has cloud-init baked in, allowing user-data (e.g. a user/password) to be seeded into the guest at first boot
                    example: false
                default_command:
                    type: array
                    items:
                        type: string
                        example: Aut et voluptas quos.
                    description: Explicit container entrypoint at workspace creation
                    example:
                        - Accusantium ea.
                        - Fuga ipsum.
                        - Consequatur molestiae.
                default_container_init:
                    $ref: '#/components/schemas/ContainerInitDefaults'
                default_credentials:
                    $ref: '#/components/schemas/ImageCredentials'
                default_env:
                    type: array
                    items:
                        $ref: '#/components/schemas/ImageEnvVar'
                    description: Default environment variables
                    example:
                        - name: PASSWORD
                          value: changeme
                default_homedir:
                    type: string
                    description: Default home directory for the default user
                    example: /home/coder
                default_image_pull_policy:
                    type: string
                    description: Image pull policy for workspace containers created from this image (Always, IfNotPresent, Never). Empty leaves the container field unset so Kubernetes applies its own default
                    example: Always
                    enum:
                        - Always
                        - IfNotPresent
                        - Never
                default_password:
                    type: string
                    description: Known default password for DefaultUser. Only set when the image has a known default password; leave unset when the guest uses no password
                    example: changeme
                default_path:
                    type: string
                    description: Default URL path for connecting
                    example: /
                default_port:
                    type: integer
                    description: Default container port
                    example: 8080
                    format: int64
                default_shared_memory:
                    type: boolean
                    description: Automatically mount /dev/shm as emptyDir with medium=Memory (required for Selkies streaming, Chrome, ML frameworks)
                    example: false
                default_shell:
                    type: string
                    description: Default shell for exec/console sessions (e.g. /bin/bash)
                    example: /bin/bash
                default_uid:
                    type: integer
                    description: UID that the main container runs as (sets runAsUser and fsGroup)
                    example: 1000
                    format: int64
                default_user:
                    type: string
                    description: Default user for this image
                    example: coder
                default_user_data:
                    type: string
                    description: Cloud-config for VM cloud-init or explicitly enabled container initialization
                    example: ""
                description:
                    type: string
                    description: Description of the image
                    example: Code editor in the browser
                homepage_url:
                    type: string
                    description: Project homepage or documentation URL
                    example: https://github.com/coder/code-server
                icon:
                    type: string
                    description: Icon identifier
                    example: code
                image:
                    type: string
                    description: Container image reference
                    example: codercom/code-server:latest
                image_homepage_url:
                    type: string
                    description: Container image registry page (e.g. Docker Hub)
                    example: https://hub.docker.com/r/codercom/code-server
                links:
                    type: array
                    items:
                        $ref: '#/components/schemas/ImageLink'
                    description: Additional relevant URLs for this image
                    example:
                        - title: GitHub
                          url: https://github.com/coder/code-server
                        - title: Docker Hub
                          url: https://hub.docker.com/r/codercom/code-server
                memory_limit:
                    type: string
                    description: Guest memory default
                    example: Esse consectetur est voluptas omnis quos inventore.
                memory_request:
                    type: string
                    description: Guest memory request default
                    example: Dignissimos vel ipsum labore nihil.
                name:
                    type: string
                    description: Display name
                    example: Code Server (VS Code)
                persistent_root_disk:
                    type: boolean
                    description: Import a per-workspace persistent root disk
                    example: false
                persistent_root_disk_size:
                    type: string
                    description: Persistent root capacity
                    example: Veniam sed ad aut ipsa labore mollitia.
                privileged:
                    type: boolean
                    description: Run container in privileged mode
                    default: false
                    example: false
                proxy_config:
                    $ref: '#/components/schemas/ImageProxyConfig'
                remote_desktop:
                    $ref: '#/components/schemas/ImageRemoteDesktop'
                source_url:
                    type: string
                    description: Source code repository URL
                    example: https://github.com/coder/code-server
                tags:
                    type: array
                    items:
                        type: string
                        example: Consequatur et fugiat tempore beatae voluptate.
                    description: Tags for filtering/searching images
                    example:
                        - development
                        - vscode
                vm_profile:
                    type: string
                    description: Controller-supported VM guest profile
                    example: windows11-amd64-v1
                    enum:
                        - windows11-amd64-v1
                workspace_types:
                    type: array
                    items:
                        type: string
                        example: Necessitatibus mollitia deserunt soluta est.
                    description: Workspace types this image supports (container, vm, scratch). Empty means container-only
                    example:
                        - container
            description: Payload for creating a new image
            example:
                category: IDE
                default_args:
                    - --bind-addr
                    - 0.0.0.0:8080
                default_cloud_init: false
                default_command:
                    - Amet tempora earum velit.
                    - Rerum magnam et recusandae corrupti quo.
                default_container_init:
                    mode: injected
                default_credentials:
                    password: changeme
                    username: coder
