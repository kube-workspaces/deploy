components:
    schemas:
        CheckResponseBody:
            type: object
            properties:
                status:
                    type: string
                    description: Health status
                    example: ok
            example:
                status: ok
            required:
                - status
        CloneRequestBody:
            type: object
            properties:
                cpu_limit:
                    type: string
                    description: Override the CPU limit on the clone
                    example: "1"
                cpu_request:
                    type: string
                    description: Override the CPU request on the clone
                    example: 500m
                image:
                    type: string
                    description: Override the container image on the clone
                    example: codercom/code-server:4.96.2
                memory_limit:
                    type: string
                    description: Override the memory limit on the clone
                    example: 2Gi
                memory_request:
                    type: string
                    description: Override the memory request on the clone
                    example: 512Mi
                new_name:
                    type: string
                    description: Name for the cloned workspace
                    example: my-workspace-clone
                    pattern: ^[a-z0-9]([a-z0-9\-]*[a-z0-9])?$
                    maxLength: 63
                port:
                    type: integer
                    description: Override the container port on the clone
                    example: 8080
                    format: int64
            example:
                cpu_limit: "1"
                cpu_request: 500m
                image: codercom/code-server:4.96.2
                memory_limit: 2Gi
                memory_request: 512Mi
                new_name: my-workspace-clone
                port: 8080
            required:
                - new_name
        ContainerState:
            type: object
            properties:
                message:
                    type: string
                    description: Details about the state
                    example: Container started successfully
                reason:
                    type: string
                    description: Reason for the state
                    example: Started
                started_at:
                    type: string
                    description: Time the container started
                    example: "2025-01-02T15:04:05Z"
                state:
                    type: string
                    description: 'Current state: running, waiting, terminated'
                    example: running
                    enum:
                        - running
                        - waiting
                        - terminated
                        - unknown
            description: State of the workspace container
            example:
                message: Container started successfully
                reason: Started
                started_at: "2025-01-02T15:04:05Z"
                state: running
        CreateImagePayload:
            type: object
            properties:
                category:
                    type: string
                    description: Category for grouping (e.g. Desktop, IDE, Tool, Game)
                    example: IDE
                default_args:
                    type: array
                    items:
                        type: string
                        example: Voluptatum iusto culpa at consequatur.
                    description: Default command-line args
                    example:
                        - --bind-addr
                        - 0.0.0.0:8080
                default_cloud_init:
                    type: boolean
                    description: Set to true when the image has cloud-init baked in, allowing user-data (e.g. a user/password) to be seeded into the guest at first boot
                    example: false
                default_credentials:
                    $ref: '#/components/schemas/ImageCredentials'
                default_env:
                    type: array
                    items:
                        $ref: '#/components/schemas/ImageEnvVar'
                    description: Default environment variables
                    example:
                        - name: PASSWORD
                          value: changeme
                default_homedir:
                    type: string
                    description: Default home directory for the default user
                    example: /home/coder
                default_password:
                    type: string
                    description: Known default password for DefaultUser. Only set when the image has a known default password; leave unset when the guest uses no password
                    example: changeme
                default_path:
                    type: string
                    description: Default URL path for connecting
                    example: /
                default_port:
                    type: integer
                    description: Default container port
                    example: 8080
                    format: int64
