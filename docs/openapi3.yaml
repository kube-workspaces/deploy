        ImageProxyConfig:
            type: object
            properties:
                custom_request_headers:
                    type: object
                    description: Additional headers to inject into proxied requests
                    example:
                        x-tenant: workspaces
                    additionalProperties:
                        type: string
                        example: A cum sit tenetur rem dignissimos laudantium.
                inject_base_tag:
                    type: boolean
                    description: Inject a <base> tag into HTML responses to fix relative path resolution
                    default: false
                    example: true
                needs_noop_sw:
                    type: boolean
                    description: Serve a no-op ServiceWorker at /sw.js to prevent SW registration errors
                    default: false
                    example: false
                preserve_path_prefix:
                    type: boolean
                    description: Forward the full proxy path (including /proxy/{ns}/{name}) to the pod instead of stripping it. Required for apps configured with a base URL matching the proxy prefix.
                    default: false
                    example: true
                rewrite_host_absolute_paths:
                    type: boolean
                    description: Rewrite requests with absolute paths that escape the proxy prefix using Referer header
                    default: false
                    example: true
                tls_insecure:
                    type: boolean
                    description: Connect to backend over HTTPS with skip-verify (for self-signed certs)
                    default: false
                    example: false
                websocket_paths:
                    type: array
                    items:
                        type: string
                        example: Quibusdam velit voluptates ut reprehenderit natus quos.
                    description: Paths that use WebSocket (informational, all paths support WS transparently)
                    example:
                        - /websockify
            description: Proxy configuration hints for a workspace image
            example:
                custom_request_headers:
                    x-tenant: workspaces
                inject_base_tag: true
                needs_noop_sw: true
                preserve_path_prefix: false
                rewrite_host_absolute_paths: false
                tls_insecure: false
                websocket_paths:
                    - /websockify
