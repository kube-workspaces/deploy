            description: Payload for attaching a controller to a workspace's guest agent session
            example:
                name: my-workspace
                namespace: workspaces
                participant: chris-laptop
            required:
                - name
        AgentAttachPayload2:
            type: object
            properties:
                participant:
                    type: string
                    description: Viewer-chosen participant label, echoed in session records. Not an authorization boundary
                    example: chris-laptop
            example:
                participant: chris-laptop
        AgentRelease:
            type: object
            properties:
                ok:
                    type: boolean
                    description: 'Whether the session is gone (unknown ids report ok: best-effort release)'
                    example: true
            description: Result of releasing a workspace guest agent session
            example:
                ok: true
            required:
                - ok
        AgentRenew:
            type: object
            properties:
                protocol:
                    type: integer
                    description: Agent ticket/API revision
                    example: 1
                    format: int64
                ttl_ms:
                    type: integer
                    description: Renewed lifetime in milliseconds
                    example: 60000
                    format: int64
            description: Result of renewing a workspace guest agent session
            example:
                protocol: 1
                ttl_ms: 60000
            required:
                - ttl_ms
                - protocol
        AgentStatus:
            type: object
            properties:
                active:
                    type: boolean
                    description: Whether at least one live agent session is bound to this workspace
                    example: true
                protocol:
                    type: integer
                    description: Agent ticket/API revision
                    example: 1
                    format: int64
                sessions:
                    type: integer
                    description: Live (unexpired) session count for this workspace
                    example: 1
                    format: int64
            description: 'Live agent session state for a workspace: whether any unexpired attach session exists'
            example:
                active: true
                protocol: 1
                sessions: 1
            required:
                - active
                - sessions
                - protocol
        AgentTicket:
            type: object
            properties:
                id:
                    type: string
                    description: Opaque server-side session identifier for renew/release correlation. Never sent to the guest
                    example: 8ec18121f4c2409aa7c025487f4e310c
                protocol:
                    type: integer
                    description: Agent ticket/API revision
                    example: 1
                    format: int64
                ticket:
                    type: string
                    description: Signed bearer ticket (id.payload.signature) to present in the agent attach message
                    example: 8ec18121f4c2409aa7c025487f4e310c.eyJ3b3Jrc3BhY2VVaWQiOiJ3cy0xIn0.c2ln
                ttl_ms:
                    type: integer
                    description: Ticket/session lifetime in milliseconds; renew at half of it
                    example: 60000
                    format: int64
            description: Short-lived attach ticket for a workspace guest agent session
            example:
                id: 8ec18121f4c2409aa7c025487f4e310c
                protocol: 1
                ticket: 8ec18121f4c2409aa7c025487f4e310c.eyJ3b3Jrc3BhY2VVaWQiOiJ3cy0xIn0.c2ln
                ttl_ms: 60000
            required:
                - id
                - ticket
                - ttl_ms
                - protocol
        AgentUpgradeAttempt:
            type: object
            properties:
                actor_id:
                    type: string
                    description: UID of the administrator that admitted the attempt
                    example: user-uid-1
                admitted_at:
                    type: string
                    description: RFC3339 admission timestamp
                    example: "2026-10-19T00:00:00Z"
                    format: date-time
                allow_reboot:
                    type: boolean
                    description: Whether the admitted attempt may run the bounded reboot sequence
                    example: false
                attempt_id:
                    type: string
                    description: Server-minted attempt identifier
                    example: upg_9f82c1a0b3d4e5f60718293a
                    pattern: ^upg_[0-9a-f]{24}$
                awaiting_reboot_at:
                    type: string
                    example: "2015-01-21T06:32:53Z"
                    format: date-time
                cancel_requested:
                    type: boolean
                    description: An administrator requested safe-boundary cancellation
                    example: false
                error_code:
                    type: string
                    description: Bounded machine-readable failure code
                    example: ""
                execution_id:
                    type: string
                    description: Linked execution admission record (recording authorization)
                    example: exec_9f82
                expected_installed_inventory_sha256:
                    type: string
                    example: 810151abf0615815b24e01967ec665e0eb583500f1eb5fa456361935b22b183b
                    pattern: ^[0-9a-f]{64}$
                installing_at:
                    type: string
                    example: "1972-09-05T17:52:41Z"
                    format: date-time
                journal_sequence:
                    type: integer
                    description: Last reconciled guest journal sequence
                    example: 0
                    format: int64
                namespace:
                    type: string
                    example: team-a
                predecessor_manifest_sha256:
                    type: string
                    description: Pinned rollback predecessor manifest digest
                    example: eef078d78f9fa999c17108b9260a644f530ab67305d1e010f07263bb68cdf11d
                    pattern: ^[0-9a-f]{64}$
                predecessor_target_id:
                    type: string
                    description: Pinned rollback predecessor target
                    example: windows11-amd64-v1
                prepared_at:
                    type: string
                    example: "1974-06-22T04:20:45Z"
                    format: date-time
                recording_id:
                    type: string
                    description: Protected attempt recording
                    example: rec_9f82
                recording_url:
                    type: string
                    description: Independently authorized recording link
                    example: /v1/executions/exec_9f82/recording
                rollback_requested_at:
                    type: string
                    example: "1974-11-08T15:49:56Z"
                    format: date-time
                rolling_back_at:
                    type: string
                    example: "2006-01-11T00:05:40Z"
                    format: date-time
                staging_at:
                    type: string
                    example: "2006-11-08T02:00:15Z"
                    format: date-time
                state:
                    type: string
                    description: Attempt lifecycle state
                    example: admitted
                    enum:
                        - admitted
                        - staging
                        - prepared
                        - installing
                        - verifying
                        - succeeded
                        - awaiting_reboot
                        - rollback_pending
                        - rolling_back
                        - rolled_back
                        - cancelled
                        - failed
                        - manual_recovery_required
                        - unknown
                        - recording_lost
                status_url:
                    type: string
                    description: Canonical status URL for this attempt
                    example: /v1/workspaces/vm-1/agent-upgrades/upg_9f82c1a0b3d4e5f60718293a?namespace=team-a
                target_id:
                    type: string
                    example: windows11-amd64-v2
                target_manifest_sha256:
                    type: string
                    example: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
                    pattern: ^[0-9a-f]{64}$
                terminal_at:
                    type: string
                    example: "1986-01-12T19:14:09Z"
                    format: date-time
                updated_at:
                    type: string
                    example: "1971-02-13T03:47:45Z"
                    format: date-time
                verifying_at:
                    type: string
                    example: "1981-03-10T06:49:07Z"
                    format: date-time
                vm_uid:
                    type: string
                    description: Controller-owned VM UID the reservation is bound to
                    example: 0d3f9a7e-6b1c-4f2a-9e8d-1a2b3c4d5e6f
                workspace_name:
                    type: string
                    example: vm-1
                workspace_uid:
                    type: string
                    example: abc123
            description: Admitted agent upgrade attempt with phase progress and outcome
            example:
                actor_id: user-uid-1
                admitted_at: "2026-10-19T00:00:00Z"
                allow_reboot: false
                attempt_id: upg_9f82c1a0b3d4e5f60718293a
                awaiting_reboot_at: "2002-11-10T10:31:46Z"
                cancel_requested: false
                error_code: ""
                execution_id: exec_9f82
                expected_installed_inventory_sha256: 810151abf0615815b24e01967ec665e0eb583500f1eb5fa456361935b22b183b
                installing_at: "1986-01-20T17:17:37Z"
                journal_sequence: 0
                namespace: team-a
                predecessor_manifest_sha256: 38bdfd676f625f7d2883851f026f6f830dc767ed0fe0e4882dd5b7b3b86e5985
                predecessor_target_id: windows11-amd64-v1
                prepared_at: "1971-12-16T05:05:24Z"
                recording_id: rec_9f82
                recording_url: /v1/executions/exec_9f82/recording
                rollback_requested_at: "1985-06-05T12:20:12Z"
                rolling_back_at: "1987-07-04T11:50:32Z"
                staging_at: "2000-04-25T20:23:10Z"
                state: admitted
                status_url: /v1/workspaces/vm-1/agent-upgrades/upg_9f82c1a0b3d4e5f60718293a?namespace=team-a
                target_id: windows11-amd64-v2
                target_manifest_sha256: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
                terminal_at: "1991-07-11T19:29:08Z"
                updated_at: "2011-04-29T04:33:11Z"
                verifying_at: "2015-03-03T21:55:54Z"
                vm_uid: 0d3f9a7e-6b1c-4f2a-9e8d-1a2b3c4d5e6f
                workspace_name: vm-1
                workspace_uid: abc123
            required:
                - attempt_id
                - namespace
                - workspace_name
                - workspace_uid
                - vm_uid
                - actor_id
                - state
                - target_id
                - target_manifest_sha256
                - expected_installed_inventory_sha256
                - allow_reboot
                - cancel_requested
                - execution_id
                - recording_id
                - recording_url
                - status_url
                - journal_sequence
                - admitted_at
                - updated_at
        AgentUpgradeAvailability:
            type: object
            properties:
                active_attempt_id:
                    type: string
                    description: Reservation-holding attempt for this VM, when present
                    example: upg_9f82c1a0b3d4e5f60718293a
                admissible:
                    type: boolean
                    description: A start request would be admitted right now
                    example: false
                deny_reason:
                    type: string
                    description: Why start would be denied; empty when admissible
                    example: policy_disabled
                    enum:
                        - ""
                        - policy_disabled
                        - storage_unavailable
                        - eligibility_unavailable
                        - workspace_not_eligible
                        - attempt_active
                inventory_available:
                    type: boolean
                    description: Fresh authenticated guest inventory is available (guest integration)
                    example: false
                policy_enabled:
                    type: boolean
                    description: Platform policy admits agent upgrades
                    example: false
                storage_available:
                    type: boolean
                    description: Durable attempt/recording storage is ready
                    example: false
                vm_uid:
                    type: string
                    description: Resolved controller-owned VM UID, when eligible
                    example: 0d3f9a7e-6b1c-4f2a-9e8d-1a2b3c4d5e6f
                workspace_eligible:
                    type: boolean
                    description: Workspace resolves as an eligible running Windows VM
                    example: false
            description: Fresh agent-upgrade availability for one workspace
            example:
                active_attempt_id: upg_9f82c1a0b3d4e5f60718293a
                admissible: false
                deny_reason: policy_disabled
                inventory_available: false
                policy_enabled: false
                storage_available: false
                vm_uid: 0d3f9a7e-6b1c-4f2a-9e8d-1a2b3c4d5e6f
                workspace_eligible: false
            required:
                - policy_enabled
                - storage_available
                - workspace_eligible
                - inventory_available
                - admissible
                - deny_reason
        AgentUpgradeStartPayload:
            type: object
            properties:
                allow_reboot:
                    type: boolean
                    description: Permit the recorded bounded reboot sequence
                    default: false
                    example: false
                expected_installed_inventory_sha256:
                    type: string
                    description: Client-observed installed inventory digest (re-verified before install)
                    example: 810151abf0615815b24e01967ec665e0eb583500f1eb5fa456361935b22b183b
                    pattern: ^[0-9a-f]{64}$
                expected_revocation_epoch:
                    type: integer
                    description: Client-observed execution revocation epoch
                    example: 4
                    format: int64
                expected_vm_uid:
                    type: string
                    description: Client-observed VM UID; must match the current controller-owned UID
                    example: 0d3f9a7e-6b1c-4f2a-9e8d-1a2b3c4d5e6f
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,255}$
                idempotency_key:
                    type: string
                    description: Client-chosen key; an identical replay returns the original attempt
                    example: run-2026-10-19-001
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
                name:
                    type: string
                    example: vm-1
                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                    maxLength: 253
                namespace:
                    type: string
                    default: workspaces
                    example: team-a
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    maxLength: 63
                target_id:
                    type: string
                    description: Operator-approved immutable target
                    example: windows11-amd64-v2
                    pattern: ^[a-z0-9][a-z0-9._-]{0,127}$
                target_manifest_sha256:
                    type: string
                    description: Expected signed manifest digest for the target
                    example: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
                    pattern: ^[0-9a-f]{64}$
            description: Admit a single explicit agent upgrade. Clients cannot submit URLs, hashes of payloads, install directories or installer flags.
            example:
                allow_reboot: false
                expected_installed_inventory_sha256: 810151abf0615815b24e01967ec665e0eb583500f1eb5fa456361935b22b183b
                expected_revocation_epoch: 4
                expected_vm_uid: 0d3f9a7e-6b1c-4f2a-9e8d-1a2b3c4d5e6f
                idempotency_key: run-2026-10-19-001
                name: vm-1
                namespace: team-a
                target_id: windows11-amd64-v2
                target_manifest_sha256: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
            required:
                - namespace
                - name
                - target_id
                - target_manifest_sha256
                - expected_vm_uid
                - expected_revocation_epoch
                - expected_installed_inventory_sha256
                - idempotency_key
                - allow_reboot
