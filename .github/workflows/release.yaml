name: Release

# Cut a release: validate, tag, generate notes, publish.
#
# Run this from the Actions tab with the version to release. It exists so the
# five kube-workspaces repositories are released the same way, with the same note
# structure, rather than by hand.
#
# Order matters across the org: release the four components first, then this
# repo, so the chart's appVersion names images that already exist. The
# consistency check below enforces that rather than relying on memory.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v0.3.0'
        type: string
        required: true
      dry_run:
        description: 'Print the notes without tagging or publishing'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the notes are generated from the commit range since the
          # previous tag.
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      - name: Validate the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a vX.Y.Z version"
            exit 1
          fi
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "::error::tag $VERSION already exists"
            exit 1
          fi

      # The chart version and appVersion must both match the release, or the
      # published chart will pin the wrong images.
      - name: Check chart version consistency
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          bare="${VERSION#v}"
          chart=$(helm show chart helm/kube-workspaces/ | awk '/^version:/ {print $2}')
          app=$(helm show chart helm/kube-workspaces/ | awk '/^appVersion:/ {gsub(/"/,"",$2); print $2}')

          # The chart version must equal the release: this repo's tag *is* the
          # chart release.
          if [ "$chart" != "$bare" ]; then
            echo "::error::Chart.yaml version is $chart, expected $bare"
            exit 1
          fi

          # appVersion tracks the *component* release, which is not always the
          # same number. A chart-only fix (an ingress path, a template guard)
          # bumps the chart without there being any new component build, so
          # requiring equality here would force pointless component releases.
          #
          # What must hold is that appVersion names components that exist — the
          # next step checks that — and that it is not ahead of the chart.
          if [ "$app" = "$bare" ]; then
            echo "chart $chart and appVersion $app both match $VERSION"
          else
            newest=$(printf '%s\n%s\n' "$bare" "$app" | sort -V | tail -1)
            if [ "$newest" = "$app" ]; then
              echo "::error::appVersion $app is ahead of the chart version $bare"
              echo "appVersion must name an already-released component version."
              exit 1
            fi
            echo "::notice::chart $chart pins component appVersion $app (chart-only release)"
          fi

      # A release whose chart pins images that were never published would be
      # broken on arrival.
      - name: Check the component images are published
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Check appVersion, not the release version: the chart may be released
          # on its own version line while pinning an earlier component release.
          bare=$(helm show chart helm/kube-workspaces/ \
            | awk '/^appVersion:/ {gsub(/"/,"",$2); print $2}')
          echo "checking for component images at ${bare}"
          missing=""
          for c in controller api proxy frontend; do
            token=$(curl -fsSL \
              "https://ghcr.io/token?scope=repository:kube-workspaces/${c}:pull&service=ghcr.io" \
              | jq -r '.token')
            found=""
            # The components tag bare (0.2.0); frontend currently tags v-prefixed.
            for tag in "$bare" "$VERSION"; do
              code=$(curl -sSL -o /dev/null -w '%{http_code}' \
                -H "Authorization: Bearer ${token}" \
                -H 'Accept: application/vnd.oci.image.index.v1+json' \
                -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
                -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
                "https://ghcr.io/v2/kube-workspaces/${c}/manifests/${tag}")
              [ "$code" = "200" ] && { found="$tag"; break; }
            done
            if [ -n "$found" ]; then
              echo "  ${c}: ${found}"
            else
              missing="${missing} ${c}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::no ${bare} image published for:${missing}"
            echo "Release the component repositories before this one."
            exit 1
          fi

      - name: Generate release notes
        id: notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # --version, not --to HEAD: the notes quote the version in the
          # upgrade command, and "HEAD" is not installable.
          #
          # release-notes.sh emits the whole body — preamble, upgrade steps and
          # the categorised "What's Changed" list — so the release below does not
          # need --generate-notes. That also fixes notes for direct pushes to
          # main, which GitHub's per-PR list cannot group.
          scripts/release-notes.sh --repo deploy \
            --from "$(git describe --tags --abbrev=0)" \
            --to HEAD --version "$VERSION" > /tmp/preamble.md
          cat /tmp/preamble.md

      - name: Summary
        run: |
          {
            echo "### Release notes preview for ${{ inputs.version }}"
            echo
            cat /tmp/preamble.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create the tag and release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"

          # --notes-file carries the full body generated above (preamble +
          # upgrade + categorised list); no --generate-notes needed.
          #
          # Use --notes-file rather than passing the body through a GitHub
          # expression: interpolating it into the shell makes bash treat its
          # backticks as command substitution, which silently ate every code span
          # and the fenced block. (A literal expression cannot appear even in a
          # comment here — Actions evaluates it and fails to parse the file.)
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file /tmp/preamble.md \
            --verify-tag

      - name: Dry run notice
        if: ${{ inputs.dry_run }}
        run: |
          echo "::notice::dry run — nothing was tagged or published. Re-run with dry_run=false to release."
