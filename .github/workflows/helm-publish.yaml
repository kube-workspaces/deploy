name: Publish Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - 'helm/kube-workspaces/**'
      - '.github/workflows/helm-publish.yaml'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      allow_overwrite:
        description: >-
          Republish even if this chart version already exists in GHCR.
          Only use this to repair a broken push.
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Package and push chart to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      - name: Check vendored CRDs are in sync
        run: make check-helm-crds

      - name: Lint chart
        run: helm lint helm/kube-workspaces/

      - name: Determine chart version
        id: chart
        run: |
          version=$(helm show chart helm/kube-workspaces/ | awk '/^version:/ {print $2}')
          if [ -z "$version" ]; then
            echo "::error::could not determine chart version from Chart.yaml"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Chart version: ${version}"

      # Guard against silently overwriting an already-published immutable
      # version. Without this, any push to main touching helm/** republishes
      # whatever version Chart.yaml happens to hold, clobbering a release.
      # Re-running deliberately is still possible via workflow_dispatch with
      # allow_overwrite=true.
      - name: Check version is not already published
        if: ${{ inputs.allow_overwrite != true }}
        env:
          VERSION: ${{ steps.chart.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          repo="${OWNER}/charts/kube-workspaces"
          token=$(curl -fsSL \
            "https://ghcr.io/token?scope=repository:${repo}:pull&service=ghcr.io" \
            | jq -r '.token')

          code=$(curl -sSL -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
            "https://ghcr.io/v2/${repo}/manifests/${VERSION}")

          if [ "$code" = "200" ]; then
            echo "::error::chart version ${VERSION} is already published to ghcr.io/${repo}."
            echo "Bump 'version' in helm/kube-workspaces/Chart.yaml before merging."
            exit 1
          fi
          echo "Version ${VERSION} is not yet published (HTTP ${code}) — proceeding."

      - name: Package chart
        run: |
          helm package helm/kube-workspaces/ --destination dist/

      - name: Log in to GHCR
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | \
            helm registry login ghcr.io \
              --username '${{ github.actor }}' \
              --password-stdin

      - name: Push chart to GHCR
        run: |
          helm push \
            "dist/kube-workspaces-${{ steps.chart.outputs.version }}.tgz" \
            oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Summary
        run: |
          {
            echo "### Helm chart published"
            echo
            echo '```sh'
            echo "helm install kube-workspaces \\"
            echo "  oci://ghcr.io/${{ github.repository_owner }}/charts/kube-workspaces \\"
            echo "  --version ${{ steps.chart.outputs.version }} \\"
            echo "  --namespace kube-workspaces-system --create-namespace"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
