apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-workspaces-crds
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kube-workspaces/deploy.git
    targetRevision: main
    path: kustomize/crds
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Replace=true
