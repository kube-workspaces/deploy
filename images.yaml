apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: debian-xfce
  annotations:
    catalog.kubeworkspaces.io/example: "true"
    kubeworkspaces.io/ssh-key-propagation: qemuGuestAgent
spec:
  displayName: Debian Desktop XFCE
  description: Debian Linux virtual machine with a lightweight XFCE desktop,
    accessible via the graphical VNC display console. The root disk is a
    persistent DataVolume (CDI registry import), so the desktop and any changes
    survive restarts. XFCE is installed by cloud-init on first boot and uses 4Gi
    of memory by default. Supports fluid display resize (the guest follows the
    console window size).
  category: Desktop
  tags:
  - vm
  - linux
  - debian
  - desktop
  - gui
  - xfce
  defaultPort: 8080
  additionalPorts:
  - name: ssh
    port: 22
  # Premium agent steel thread (opt-in): guest TCP port of the kw-agent
  # listener. The controller forwards it through the KubeVirt masquerade
  # interface and exposes it on the workspace Service; the proxy bridges
  # /agent/ to it once AGENT_API_URL is configured chart-side. Selkies stays
  # the default path until the Linux agent passes parity. Canonical port
  # 44787 is shared with the Windows premium test image.
  proxyConfig:
    agentPort: 44787
  remoteDesktop:
    protocol: selkies
    port: 8080
    path: /
  homepageURL: https://www.debian.org
  image: quay.io/containerdisks/debian:13
  imageHomepageURL: https://quay.io/repository/containerdisks/debian
  sourceURL: https://github.com/kubevirt/containerdisks
  defaultUser: debian
  defaultPassword: debian
  defaultCloudInit: true
  defaultUserData: |
    #cloud-config
    ssh_pwauth: true
    chpasswd:
      expire: false
      list: |
        debian:debian
    # bootcmd runs before package installation and on every boot. Replace the
    # cloud image's MAC-bound netplan configuration before installing XFCE;
    # networkd owns the NIC even after NetworkManager is pulled in by the task.
    bootcmd:
    - |
      set -eu
      mkdir -p /etc/netplan /etc/cloud/cloud.cfg.d
      printf 'network: {config: disabled}\n' > /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
      cat > /etc/netplan/50-cloud-init.yaml <<'EOF'
      network:
        version: 2
        renderer: networkd
        ethernets:
          workspace:
            match:
              name: "en*"
            dhcp4: true
            dhcp6: false
            dhcp4-overrides:
              use-dns: false
            nameservers:
              addresses: [1.1.1.1, 9.9.9.9]
      EOF
      chmod 600 /etc/netplan/50-cloud-init.yaml
      netplan apply
      # Public DNS avoids hard-coding a cluster-specific Service IP.
      # Use a regular file rather than the cloud image's resolved stub symlink;
      # keep it editable so operators can supply site-specific resolvers.
      rm -f /etc/resolv.conf
      printf 'nameserver 1.1.1.1\nnameserver 9.9.9.9\n' > /etc/resolv.conf
      chmod 644 /etc/resolv.conf
    package_update: true
    packages:
    - task-xfce-desktop
    # Keep the password prompt on Selkies' captured X display. light-locker
    # switches to a separate LightDM greeter/VT, leaving DISPLAY=:0 black
    # and sending remote input to the inactive user session instead.
    - xfce4-screensaver
    - qemu-guest-agent
    - curl
    - ca-certificates
    - dbus-x11
    # The containerdisk ships the Debian "cloud" kernel, which intentionally
    # omits virtio_gpu — no /dev/dri, no graphical logind seat, no Xorg. The
    # generic kernel is installed here and made the only one (removed below),
    # then the guest reboots into it (power_state).
    - linux-image-amd64
    write_files:
    # The VM has no physical monitor to save power on. Keep the virtual
    # output enabled; the in-session screensaver still blanks and locks.
    # Defer until after packages so the power-manager package is installed.
    - path: /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xfce4-power-manager.xml
      defer: true
      permissions: "0644"
      content: |
        <?xml version="1.0" encoding="UTF-8"?>
        <channel name="xfce4-power-manager" version="1.0">
          <property name="xfce4-power-manager" type="empty">
            <property name="power-button-action" type="uint" value="3"/>
            <property name="dpms-enabled" type="bool" value="false"/>
          </property>
        </channel>
    # Autologin the default user straight into an XFCE session.
    - path: /etc/lightdm/lightdm.conf.d/50-autologin.conf
      permissions: "0644"
      content: |
        [Seat:*]
        user-session=xfce
        autologin-user=debian
        autologin-session=xfce
        autologin-user-timeout=0
        logind-check-graphical=false
    # Apply the virtio-gpu EDID preferred mode to the active X display. When
    # the VNC client resizes the window, QEMU processes SetDesktopSize and
    # updates the guest EDID; the new size becomes the first (preferred) mode
    # in /sys/class/drm/card0-*/modes. A tiny systemd service polls that file
    # and applies the new size with `xrandr --auto`. Polling (rather than a
    # udev RUN rule) avoids the uevent-storm races where concurrent handlers
    # could apply a stale size.
    - path: /usr/local/sbin/kw-display-resized
      permissions: "0755"
      content: |
        #!/bin/bash
        set -u
        POLL=0.5
        MODES=""
        find_modes() {
          MODES=$(ls /sys/class/drm/card0-*/modes 2>/dev/null | head -n1)
        }
        find_display() {
          local active_vt vtn
          active_vt=$(cat /sys/class/tty/tty0/active 2>/dev/null)
          vtn=""
          case "$active_vt" in tty*) vtn=${active_vt#tty} ;; esac
          DISPLAY_NUM=""
          if [ -n "$vtn" ]; then
            DISPLAY_NUM=$(ps -eo args= | grep "[X]org" | grep "vt$vtn" \
              | grep -oE ":[0-9]+" | head -n1)
          fi
          if [ -z "$DISPLAY_NUM" ]; then
            DISPLAY_NUM=$(ps -eo lstart=,args= 2>/dev/null | grep "[X]org" \
              | sort -k1,5 | tail -n1 | grep -oE ":[0-9]+" | head -n1)
          fi
          XAUTH=""
          if [ -n "$DISPLAY_NUM" ]; then
            XAUTH=$(ls /var/run/lightdm/root/ 2>/dev/null \
              | grep -F "$DISPLAY_NUM" | head -n1)
            [ -n "$XAUTH" ] || XAUTH=$(ls /var/run/lightdm/root/ 2>/dev/null \
              | tail -n1)
          fi
        }
        apply() {
          local preferred current
          preferred=$(head -n1 "$MODES" 2>/dev/null)
          [ -n "$preferred" ] || return 0
          find_display
          [ -n "$DISPLAY_NUM" ] && [ -n "$XAUTH" ] || return 0
          current=$(DISPLAY="$DISPLAY_NUM" \
            XAUTHORITY="/var/run/lightdm/root/$XAUTH" xrandr 2>/dev/null \
            | grep -oE 'current [0-9]+ x [0-9]+' | head -n1)
          if [ "$current" != "current ${preferred%x*} x ${preferred#*x}" ]; then
            DISPLAY="$DISPLAY_NUM" \
              XAUTHORITY="/var/run/lightdm/root/$XAUTH" \
              xrandr --output Virtual-1 --auto 2>/dev/null || true
          fi
        }
        last=""
        while true; do
          find_modes
          if [ -n "$MODES" ]; then
            cur=$(head -n1 "$MODES" 2>/dev/null)
            if [ -n "$cur" ] && [ "$cur" != "$last" ]; then
              sleep "$POLL"
              find_modes
              apply
              last=$(head -n1 "$MODES" 2>/dev/null)
            fi
          fi
          sleep "$POLL"
        done
    - path: /etc/systemd/system/kw-display-resize.service
      permissions: "0644"
      content: |
        [Unit]
        Description=Apply virtio-gpu EDID preferred mode to the active X display
        After=display-manager.service

        [Service]
        ExecStart=/usr/local/sbin/kw-display-resized
        Restart=always
        RestartSec=2

        [Install]
        WantedBy=multi-user.target
    - path: /etc/systemd/system/selkies.service
      permissions: "0644"
      content: |
        [Unit]
        Description=Selkies Remote Desktop Agent
        After=display-manager.service network-online.target
        Wants=network-online.target

        [Service]
        Type=simple
        User=debian
        Group=debian
        WorkingDirectory=/home/debian
        # SELKIES_BASIC_AUTH_PASSWORD is not set: proxy handles auth.
        # SELKIES_ENABLE_BASIC_AUTH=false disables the built-in login.
        # SELKIES_ADDR=0.0.0.0 is safe because it is only reachable via
        # the cluster network / masquerade.
        Environment=HOME=/home/debian
        Environment=XDG_RUNTIME_DIR=/run/user/1000
        Environment=DISPLAY=:0
        Environment=SELKIES_ADDR=0.0.0.0
        Environment=SELKIES_PORT=8080
        Environment=SELKIES_MODE=websockets
        Environment=SELKIES_ENCODER=h264enc
        Environment=SELKIES_USE_CPU=true
        Environment=SELKIES_ENABLE_BASIC_AUTH=false
        Environment=SELKIES_GAMEPAD_ENABLED=false
        Environment=SELKIES_ENABLE_RESIZE=false
        ExecStart=/usr/bin/selkies
        Restart=always
        RestartSec=5

        [Install]
        WantedBy=multi-user.target
    runcmd:
    # The desktop task recommends light-locker. Replace it, rather than
    # disabling screen locking: xfce4-screensaver locks within the session
    # that Selkies captures and injects input into.
    - DEBIAN_FRONTEND=noninteractive apt-get -y purge light-locker
    - systemctl set-default graphical.target
    - curl --fail --location --retry 3 -o /tmp/selkies.deb https://github.com/selkies-project/selkies/releases/download/2.0.0rc0/selkies-2.0.0rc0-trixie-amd64.deb
    - printf 'ca42bc605fcfd0e396886a88a3d2844ef976e0cf43ff8d97e90432c3a340c0b9  /tmp/selkies.deb' | sha256sum --check
    - apt-get install -y --no-install-recommends /tmp/selkies.deb
    - rm /tmp/selkies.deb
    # The desktop task pulls plymouth mid-install, which races the generic
    # kernel's initramfs regeneration (postinst fails, dpkg left unconfigured).
    # Finish pending configuration before pruning the cloud kernel.
    - dpkg --configure -a
    # Drop the cloud kernel so the generic one is the only GRUB entry; its
    # removal triggers update-grub, and power_state then reboots.
    - DEBIAN_FRONTEND=noninteractive apt-get -y purge 'linux-image-*-cloud-amd64' 'linux-headers-*-cloud-amd64' 'linux-image-cloud-amd64' || true
    - systemctl daemon-reload
    - systemctl enable --now qemu-guest-agent.service
    - systemctl enable --now kw-display-resize.service selkies.service
    power_state:
      mode: reboot
      delay: now
  persistentRootDisk: true
  persistentRootDiskSize: 20Gi
  memoryLimit: 4Gi
  memoryRequest: 5Gi
  videoDevice: virtio
  # Intel HDA sound card (ich9) enables guest audio over QEMU's VNC audio
  # channel (Tier 0 audio playback in the web client; the desktop client only
  # detects the device). ich9/intel-hda is
  # available on all QEMU builds (AC97 may be compiled out), and Debian ships
  # snd-hda-intel with generic analog playback. The guest runs an audio server
  # (ALSA/pulse/pipewire) configured to output to the HDA device.
  soundDevice: ich9
  workspaceTypes:
  - vm
