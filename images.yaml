apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: alpine-container-init-baked
spec:
  displayName: Alpine Linux — baked-in container-init demo
  description: Alpine with container-init already in the image. Demonstrates
    data-only cloud-config delivery, curl installation and explicit application
    handoff without an installer init container. Terminal access only.
  category: Tool
  tags: [alpine, container, scratch, cloud-config]
  image: ghcr.io/kube-workspaces/container-init:latest
  defaultPort: 80
  defaultPath: /
  defaultShell: /bin/sh
  homepageURL: https://alpinelinux.org
  imageHomepageURL: https://github.com/kube-workspaces/container-init/pkgs/container/container-init
  sourceURL: https://github.com/kube-workspaces/container-init
  icon: https://cdn.simpleicons.org/alpinelinux/0D597F
  workspaceTypes: [container, scratch]
  defaultCommand: [/usr/local/bin/container-init]
  defaultArgs: [--user-data, /run/container-init/user-data, --, sleep, infinity]
  defaultContainerInit:
    mode: baked-in
  defaultUserData: |
    #cloud-config
    packages: [curl]
    write_files:
      - path: /etc/container-init-demo.txt
        content: |
          Created by baked-in container-init in the main Alpine container.
        permissions: '0644'
    runcmd:
      - [sh, -c, "curl --version > /run/container-init-demo-curl.txt"]
      - [touch, /run/container-init-demo-ready]
---
