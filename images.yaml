  workspaceTypes:
  - container
  - scratch
  sourceURL: https://github.com/linuxserver/docker-unifi-network-application
  additionalPorts:
  - name: udp-3478
    port: 3478
    protocol: UDP
  - name: udp-10001
    port: 10001
    protocol: UDP
  - name: tcp-8080
    port: 8080
    protocol: TCP
  - name: udp-1900
    port: 1900
    protocol: UDP
  - name: tcp-8843
    port: 8843
    protocol: TCP
  - name: tcp-8880
    port: 8880
    protocol: TCP
  - name: tcp-6789
    port: 6789
    protocol: TCP
  - name: udp-5514
    port: 5514
    protocol: UDP
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    scheme: https
    tlsSkipVerify: true
