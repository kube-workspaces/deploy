apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: code-server
spec:
  defaultArgs:
  - --bind-addr
  - 0.0.0.0:8080
  - --auth
  - none
  defaultEnv:
  - name: VSCODE_PROXY_URI
    value: /proxy/{{namespace}}/{{name}}/proxy/{{port}}/
  defaultPath: /
  defaultPort: 8080
  description: Browser-based VS Code experience
  category: IDE
  tags:
  - code
  - vscode
  - editor
  displayName: Code Server (VS Code)
  homepageURL: https://github.com/coder/code-server
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/code-server.png
  image: codercom/code-server:latest
  imageHomepageURL: https://hub.docker.com/r/codercom/code-server
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
  sourceURL: https://github.com/coder/code-server
  defaultUser: coder
  defaultHomedir: /home/coder
  defaultUID: 1000
  defaultInitContainers:
    - name: volume-permissions
      image: busybox:1.37
      command: ["sh", "-c", "chown -R {{uid}}:{{uid}} /home/coder"]
---
apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: debian-desktop
spec:
  defaultPath: /vnc.html?resize=remote
  defaultPort: 6901
  description: Debian desktop in a container with web access via TigerVNC and websockify.
  category: Desktop
  tags:
  - vnc
  - linux
  - debian
  displayName: Debian Desktop
  homepageURL: https://github.com/flaccid/container-debian-desktop/blob/main/README.md
  icon: https://raw.githubusercontent.com/flaccid/container-debian-desktop/refs/heads/main/config/openlogo-debianV2.svg
  image: flaccid/debian-desktop:latest
  imageHomepageURL: https://hub.docker.com/r/flaccid/debian-desktop
  privileged: false
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    audioPort: 6902
  additionalPorts:
    - name: audio
      port: 6902
  sourceURL: https://github.com/flaccid/container-debian-desktop
  defaultUser: admin
  defaultHomedir: /home/admin
---
apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: filebrowser
spec:
  defaultPath: /
  defaultPort: 80
  description: Web-based file manager — browse, upload, download, delete, rename,
    and edit files through a clean web interface. Perfect for managing persistent
    volumes.
  category: Tool
  tags:
  - files
  - storage
  displayName: File Browser
  homepageURL: https://filebrowser.org
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/filebrowser.svg
  image: filebrowser/filebrowser:latest
  imageHomepageURL: https://hub.docker.com/r/filebrowser/filebrowser
  defaultEnv:
    - name: FB_BASE_URL
      value: /proxy/{{namespace}}/{{name}}
  defaultUID: 1000
  defaultInitContainers:
    - name: volume-permissions
      image: busybox:1.37
      command: ["sh", "-c", "chown -R {{uid}}:{{uid}} /srv"]
  proxyConfig:
    needsNoopSW: true
    preservePathPrefix: true
    rewriteHostAbsolutePaths: true
  sourceURL: https://github.com/filebrowser/filebrowser
  defaultHomedir: /srv
---
