# Default values for kube-workspaces
replicaCount: 1

controller:
  image:
    repository: ghcr.io/kube-workspaces/controller
    # Empty means Chart.AppVersion, so the chart installs the component
    # release it declares. Override to pin a specific tag or use :latest.
    tag: ""
    pullPolicy: Always
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 64Mi

api:
  image:
    repository: ghcr.io/kube-workspaces/api
    # Empty means Chart.AppVersion, so the chart installs the component
    # release it declares. Override to pin a specific tag or use :latest.
    tag: ""
    pullPolicy: Always
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  port: 8080
  externalHost: ""
  allowedOrigins: "https://workspaces.example.com,http://localhost:3000"

proxy:
  image:
    repository: ghcr.io/kube-workspaces/proxy
    # Empty means Chart.AppVersion, so the chart installs the component
    # release it declares. Override to pin a specific tag or use :latest.
    tag: ""
    pullPolicy: Always
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  port: 8080
  allowedOrigins: "https://workspaces.example.com,http://localhost:3000"
  # Path prefix for proxy routes. Always "/proxy" (single-mode).
  pathPrefix: "/proxy"
  service:
    type: ClusterIP

frontend:
  image:
    repository: ghcr.io/kube-workspaces/frontend
    # Empty means Chart.AppVersion, so the chart installs the component
    # release it declares. Override to pin a specific tag or use :latest.
    tag: ""
    pullPolicy: Always
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  port: 3000
  externalApiUrl: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Optional Traefik Middleware CRs (traefik.io/v1alpha1) rendered into the
  # release namespace. Each entry is {name, spec}; spec is passed through
  # verbatim, so any middleware the Traefik CRD supports can be declared here.
  # Attach them to the Ingress via annotations, e.g. Traefik stripPrefix:
  #
  #   ingress:
  #     annotations:
  #       traefik.ingress.kubernetes.io/router.middlewares: <release-namespace>-<name>@kubernetescrd
  #     middlewares:
  #       - name: kube-workspaces-strip-api
  #         spec:
  #           stripPrefix:
  #             prefixes:
  #               - /api
  middlewares: []
  # Each host entry needs its own `paths` list. If you override `hosts` you must
  # supply `paths` too — a host with no paths renders an invalid Ingress.
  hosts:
    - host: workspaces.local
      paths:
        # Workspace traffic is served by the proxy, not the API. The API has no
        # /proxy routes, so pointing this at the API 404s every workspace.
        - path: /proxy
          pathType: Prefix
          backend:
            serviceName: kube-workspaces-proxy
            servicePort: 80
        - path: /v1
          pathType: Prefix
          backend:
            serviceName: kube-workspaces-api
            servicePort: 80
        - path: /auth
          pathType: Prefix
          backend:
            serviceName: kube-workspaces-api
            servicePort: 80
        - path: /openapi
          pathType: Prefix
          backend:
            serviceName: kube-workspaces-api
            servicePort: 80
        # Frontend catches everything else, including the /admin, /workspaces
        # and /volumes page routes.
        - path: /
          pathType: Prefix
          backend:
            serviceName: kube-workspaces-frontend
            servicePort: 80
  tls: []

# Default namespace for workspaces
workspaceNamespace: workspaces

# Namespace objects created by the chart so that config-management tools
# (e.g. Argo CD) keep them in the desired state instead of pruning them
namespaces:
  # Master switch - when false, no Namespace objects are rendered at all
  create: true
  # Render a Namespace object for the release namespace (.Release.Namespace).
  #
  # Defaults to false because it conflicts with `helm install --create-namespace`,
  # which is the documented install path: Helm creates the namespace itself in
  # order to store the release secret, then refuses to adopt it as a chart
  # resource ("invalid ownership metadata", or intermittently "already exists").
  #
  # Enable this only when something else needs the Namespace to be part of the
  # release — e.g. Argo CD, so it is not pruned — and in that case do NOT pass
  # --create-namespace. See docs/domains.md.
  createReleaseNamespace: false
  # Also create the workspace namespace (workspaceNamespace)
  createWorkspaceNamespace: true

# Workspace image catalog, vendored from kube-workspaces/image-catalog
# (https://github.com/kube-workspaces/image-catalog) — see files/images-*.yaml
# and `make sync-images` in this repo.
#
# installExampleImages: install a small curated set of Image CRs (currently
# 5: code-server, debian-desktop, kasm, kasmweb-chrome, kasmweb-desktop) so a
# first-time install has something to launch immediately.
installExampleImages: true
# installCatalogImages: install the FULL image catalog (38+ Image CRs) instead
# of just the curated examples. Takes precedence over installExampleImages
# when true.
installCatalogImages: false

# Additional/custom workspace images (become Image CRs), on top of whichever
# catalog set is enabled above. `name` becomes the Image CR object name and
# MUST be RFC 1123 compliant (lowercase alphanumerics and '-'). `displayName`
# is the label shown in the UI. Every other Image CRD field is passed through
# verbatim by templates/images.yaml.
images: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Authentication configuration (opt-in, disabled by default)
auth:
  enabled: false
  # Override the OIDC callback URL (e.g. when the API is behind a different host than the frontend)
  callbackURL: ""
  oidc:
    issuerURL: ""
    clientID: ""
    clientSecret:
      # If true, Helm will create the Secret containing the OIDC client secret
      create: false
      secretName: "kube-workspaces-oidc"
      secretKey: "client-secret"
      # The client secret value (only used when create=true)
      value: ""
    scopes:
      - "openid"
      - "email"
      - "profile"
    usernameClaim: "email"
  session:
    signingKey:
      # If true, Helm will create the Secret with an auto-generated signing key
      create: true
      secretName: "kube-workspaces-session"
      secretKey: "signing-key"
      # Provide an explicit value, or leave empty for auto-generation
      value: ""
    tokenExpiry: "24h"
    refreshExpiry: "7d"
  personalNamespaces:
    enabled: false
    template: "{{username}}"
    labels: {}
    annotations: {}
    resourceQuota: {}
  registration:
    autoProvision: true
    defaultRole: "editor"
    allowedDomains: []
    allowedEmails: []
    requireApproval: false
  adminEmails: []
  # Authorization settings. When restrictNamespaceAccess is true, non-admin
  # users can only access namespaces explicitly assigned to them (via User CR
  # namespaceAccess + personal namespace); the CRD default (false) lets all
  # authenticated users see all namespaces. The authorization block is only
  # rendered when restrictNamespaceAccess is explicitly set.
  authorization: {}
  # Local (username/password) authentication. May be enabled independently of,
  # or alongside, OIDC. When enabled, a default admin user is auto-created with
  # a randomly generated password stored in a Kubernetes Secret (see
  # docs/authentication.md for retrieval instructions).
  localAuth:
    enabled: false
    bootstrapAdmin:
      email: "admin@local"
      # Set to true to skip auto-creating the bootstrap admin user, e.g. if one
      # has already been provisioned manually.
      skip: false

# Install workspace RBAC ClusterRoles (used by User controller for RoleBindings)
workspaceRoles:
  create: true

# Bundled Dex OIDC provider (optional).
# Set dex.enabled=true and configure connectors to use Dex as the OIDC provider.
# When enabled, auth.oidc.issuerURL should point to the Dex service URL.
dex:
  enabled: false
  # Override Dex values below. See https://github.com/dexidp/helm-charts for full reference.
  # Example configuration:
  # config:
  #   issuer: "https://dex.example.com"
  #   storage:
  #     type: kubernetes
  #     config:
  #       inCluster: true
  #   web:
  #     http: 0.0.0.0:5556
  #   staticClients:
  #     - id: kube-workspaces
  #       name: Kube Workspaces
  #       secret: <your-client-secret>
  #       redirectURIs:
  #         - "https://workspaces.example.com/auth/callback"
  #   connectors:
  #     - type: github
  #       id: github
  #       name: GitHub
  #       config:
  #         clientID: <github-oauth-app-client-id>
  #         clientSecret: <github-oauth-app-client-secret>
  #         redirectURI: "https://dex.example.com/callback"
