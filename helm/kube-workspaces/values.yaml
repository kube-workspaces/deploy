# Default values for kube-workspaces
replicaCount: 1

controller:
  image:
    repository: ghcr.io/kube-workspaces/controller
    tag: latest
    pullPolicy: Always
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 64Mi

api:
  image:
    repository: ghcr.io/kube-workspaces/api
    tag: latest
    pullPolicy: Always
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  port: 8080
  externalHost: ""
  allowedOrigins: "https://workspaces.example.com,http://localhost:3000"

proxy:
  image:
    repository: ghcr.io/kube-workspaces/proxy
    tag: latest
    pullPolicy: Always
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  port: 8080
  allowedOrigins: "https://workspaces.example.com,http://localhost:3000"
  # Path prefix for proxy routes. Always "/proxy" (single-mode).
  pathPrefix: "/proxy"
  service:
    type: ClusterIP

frontend:
  image:
    repository: ghcr.io/kube-workspaces/frontend
    tag: latest
    pullPolicy: Always
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  port: 3000
  externalApiUrl: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Each host entry needs its own `paths` list. If you override `hosts` you must
  # supply `paths` too — a host with no paths renders an invalid Ingress.
  hosts:
    - host: workspaces.local
      paths:
        # Workspace traffic is served by the proxy, not the API. The API has no
        # /proxy routes, so pointing this at the API 404s every workspace.
        - path: /proxy
          pathType: Prefix
          backend:
            serviceName: kube-workspaces-proxy
            servicePort: 80
        - path: /v1
          pathType: Prefix
          backend:
            serviceName: kube-workspaces-api
            servicePort: 80
        - path: /auth
          pathType: Prefix
          backend:
            serviceName: kube-workspaces-api
            servicePort: 80
        - path: /openapi
          pathType: Prefix
          backend:
            serviceName: kube-workspaces-api
            servicePort: 80
        # Frontend catches everything else, including the /admin, /workspaces
        # and /volumes page routes.
        - path: /
          pathType: Prefix
          backend:
            serviceName: kube-workspaces-frontend
            servicePort: 80
  tls: []

# Default namespace for workspaces
workspaceNamespace: workspaces

# Namespace objects created by the chart so that config-management tools
# (e.g. Argo CD) keep them in the desired state instead of pruning them
namespaces:
  # Master switch - when false, no Namespace objects are rendered at all
  create: true
  # Render a Namespace object for the release namespace (.Release.Namespace).
  #
  # Defaults to false because it conflicts with `helm install --create-namespace`,
  # which is the documented install path: Helm creates the namespace itself in
  # order to store the release secret, then refuses to adopt it as a chart
  # resource ("invalid ownership metadata", or intermittently "already exists").
  #
  # Enable this only when something else needs the Namespace to be part of the
  # release — e.g. Argo CD, so it is not pruned — and in that case do NOT pass
  # --create-namespace. See docs/domains.md.
  createReleaseNamespace: false
  # Also create the workspace namespace (workspaceNamespace)
  createWorkspaceNamespace: true

# Available workspace images (become Image CRs)
# `name` becomes the Image CR object name and MUST be RFC 1123 compliant
# (lowercase alphanumerics and '-'). `displayName` is the label shown in the UI.
images:
  - name: code-server
    displayName: "Code Server (VS Code)"
    image: "codercom/code-server:latest"
    description: "Browser-based VS Code experience"
    defaultPort: 8080
    defaultPath: "/"
    icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/code-server.png"
    homepageURL: "https://github.com/coder/code-server"
    sourceURL: "https://github.com/coder/code-server"
    defaultArgs:
      - "--bind-addr"
      - "0.0.0.0:8080"
      - "--auth"
      - "none"
    defaultEnv:
      - name: VSCODE_PROXY_URI
        value: "/proxy/{{namespace}}/{{name}}"
    proxyConfig:
      needsNoopSW: true
      rewriteHostAbsolutePaths: true
  - name: debian-desktop
    displayName: "Debian Desktop"
    image: "flaccid/debian-desktop:latest"
    description: "Full Linux desktop via noVNC"
    defaultPort: 6901
    defaultPath: "/vnc.html?resize=remote"
    icon: "https://cdn.simpleicons.org/debian/A81D33"
    homepageURL: "https://www.debian.org"
    sourceURL: "https://salsa.debian.org/debian/debian"
    # The image serves VNC on 6901 and an audio WebSocket on 6902. Both must be
    # exposed, otherwise noVNC's audio-plugin.js fails with "Protocol error".
    additionalPorts:
      - name: audio
        port: 6902
    proxyConfig:
      needsNoopSW: true
      websocketPaths:
        - "/websockify"
      rewriteHostAbsolutePaths: true
      # Serves plain HTTP on 6901 (verified). Previously had tlsInsecure: true,
      # which made the proxy dial HTTPS and fail with 502.
      scheme: http
      # Routes /audio/ requests to port 6902 instead of the default port.
      audioPort: 6902
  - name: kasm-desktop
    displayName: "Kasm Desktop"
    image: "kasmweb/desktop:1.19.0"
    description: "Ubuntu desktop streamed via KasmVNC"
    defaultPort: 6901
    defaultPath: "/"
    icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/kasm.svg"
    defaultCredentials:
      username: "kasm-user"
      password: "password"
    proxyConfig:
      needsNoopSW: true
      websocketPaths:
        - "/websockify"
      rewriteHostAbsolutePaths: true
      # KasmVNC serves HTTPS with a self-signed cert.
      scheme: https
      tlsSkipVerify: true
  - name: kasm-chrome
    displayName: "Kasm Chrome"
    image: "kasmweb/chrome:1.19.0"
    description: "Chrome browser streamed via KasmVNC"
    defaultPort: 6901
    defaultPath: "/"
    icon: "https://cdn.simpleicons.org/googlechrome/4285F4"
    privileged: true
    homepageURL: "https://kasmweb.com"
    sourceURL: "https://github.com/kasmtech"
    defaultEnv:
      - name: VNC_PW
        value: "password"
    defaultCredentials:
      username: "kasm-user"
      password: "password"
    proxyConfig:
      needsNoopSW: true
      websocketPaths:
        - "/websockify"
      rewriteHostAbsolutePaths: true
      # KasmVNC serves HTTPS with a self-signed cert.
      scheme: https
      tlsSkipVerify: true
  - name: kasm-workspaces
    displayName: "Kasm Workspaces"
    image: "linuxserver/kasm:1.19.0"
    description: "Full Kasm Workspaces platform with Docker-in-Docker. Requires privileged mode. Access the setup wizard first, then the main interface."
    defaultPort: 3000
    defaultPath: "/"
    icon: "https://cdn.simpleicons.org/linuxserver/DA3B8A"
    privileged: true
    homepageURL: "https://kasmweb.com"
    sourceURL: "https://github.com/linuxserver/docker-kasm"
    defaultEnv:
      - name: KASM_PORT
        value: "3000"
    proxyConfig:
      needsNoopSW: true
      rewriteHostAbsolutePaths: true
      # Serves HTTPS with a self-signed cert on port 3000.
      scheme: https
      tlsSkipVerify: true

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Authentication configuration (opt-in, disabled by default)
auth:
  enabled: false
  # Override the OIDC callback URL (e.g. when the API is behind a different host than the frontend)
  callbackURL: ""
  oidc:
    issuerURL: ""
    clientID: ""
    clientSecret:
      # If true, Helm will create the Secret containing the OIDC client secret
      create: false
      secretName: "kube-workspaces-oidc"
      secretKey: "client-secret"
      # The client secret value (only used when create=true)
      value: ""
    scopes:
      - "openid"
      - "email"
      - "profile"
    usernameClaim: "email"
  session:
    signingKey:
      # If true, Helm will create the Secret with an auto-generated signing key
      create: true
      secretName: "kube-workspaces-session"
      secretKey: "signing-key"
      # Provide an explicit value, or leave empty for auto-generation
      value: ""
    tokenExpiry: "24h"
    refreshExpiry: "7d"
  personalNamespaces:
    enabled: false
    template: "{{username}}"
    labels: {}
    annotations: {}
    resourceQuota: {}
  registration:
    autoProvision: true
    defaultRole: "editor"
    allowedDomains: []
    allowedEmails: []
    requireApproval: false
  adminEmails: []

# Install workspace RBAC ClusterRoles (used by User controller for RoleBindings)
workspaceRoles:
  create: true

# Bundled Dex OIDC provider (optional).
# Set dex.enabled=true and configure connectors to use Dex as the OIDC provider.
# When enabled, auth.oidc.issuerURL should point to the Dex service URL.
dex:
  enabled: false
  # Override Dex values below. See https://github.com/dexidp/helm-charts for full reference.
  # Example configuration:
  # config:
  #   issuer: "https://dex.example.com"
  #   storage:
  #     type: kubernetes
  #     config:
  #       inCluster: true
  #   web:
  #     http: 0.0.0.0:5556
  #   staticClients:
  #     - id: kube-workspaces
  #       name: Kube Workspaces
  #       secret: <your-client-secret>
  #       redirectURIs:
  #         - "https://workspaces.example.com/auth/callback"
  #   connectors:
  #     - type: github
  #       id: github
  #       name: GitHub
  #       config:
  #         clientID: <github-oauth-app-client-id>
  #         clientSecret: <github-oauth-app-client-secret>
  #         redirectURI: "https://dex.example.com/callback"
