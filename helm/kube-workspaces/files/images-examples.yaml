apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: alpine-vm
  annotations:
    catalog.kubeworkspaces.io/example: "true"
spec:
  displayName: Alpine VM
  description: Alpine Linux virtual machine (KubeVirt containerDisk). Boots a minimal
    Alpine guest; connect via the serial console.
  category: VM
  tags:
  - vm
  - linux
  - alpine
  defaultPort: 22
  homepageURL: https://alpinelinux.org
  image: quay.io/kubevirt/alpine-container-disk-demo:20260906_007c02cac1
  imageHomepageURL: https://quay.io/repository/kubevirt/alpine-container-disk-demo
  sourceURL: https://github.com/kubevirt/kubevirt/tree/main/containerimages
  defaultUser: root
  workspaceTypes:
  - vm
---
apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: code-server
  annotations:
    catalog.kubeworkspaces.io/example: "true"
spec:
  defaultArgs:
  - --bind-addr
  - 0.0.0.0:8080
  - --auth
  - none
  defaultEnv:
  - name: VSCODE_PROXY_URI
    value: /proxy/{{namespace}}/{{name}}/proxy/{{port}}/
  defaultPath: /
  defaultPort: 8080
  description: Browser-based VS Code experience
  category: IDE
  tags:
  - code
  - vscode
  - editor
  displayName: Code Server (VS Code)
  homepageURL: https://github.com/coder/code-server
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/code-server.png
  image: codercom/code-server:latest
  imageHomepageURL: https://hub.docker.com/r/codercom/code-server
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
  sourceURL: https://github.com/coder/code-server
  defaultUser: coder
  defaultHomedir: /home/coder
  defaultUID: 1000
  defaultInitContainers:
    - name: volume-permissions
      image: busybox:1.37
      command: ["sh", "-c", "chown -R {{uid}}:{{uid}} /home/coder"]
---
apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: debian-desktop
  annotations:
    catalog.kubeworkspaces.io/example: "true"
spec:
  defaultPath: /vnc.html?resize=remote
  defaultPort: 6901
  description: Debian desktop in a container with web access via TigerVNC and websockify.
  category: Desktop
  tags:
  - vnc
  - linux
  - debian
  displayName: Debian Desktop
  homepageURL: https://github.com/flaccid/container-debian-desktop/blob/main/README.md
  icon: https://raw.githubusercontent.com/flaccid/container-debian-desktop/refs/heads/main/config/openlogo-debianV2.svg
  image: flaccid/debian-desktop:latest
  imageHomepageURL: https://hub.docker.com/r/flaccid/debian-desktop
  privileged: false
  proxyConfig:
    needsNoopSW: true
    rewriteHostAbsolutePaths: true
    audioPort: 6902
  additionalPorts:
    - name: audio
      port: 6902
  sourceURL: https://github.com/flaccid/container-debian-desktop
  defaultUser: admin
  defaultHomedir: /home/admin
---
