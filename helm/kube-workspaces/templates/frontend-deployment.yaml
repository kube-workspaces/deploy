# Dedicated ServiceAccount with deliberately no Role/ClusterRole bindings.
# Exists purely so the frontend does not run as 'default'.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kube-workspaces.fullname" . }}-frontend
  labels:
    {{- include "kube-workspaces.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kube-workspaces.fullname" . }}-frontend
  labels:
    {{- include "kube-workspaces.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kube-workspaces.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "kube-workspaces.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      # The frontend is a pure UI/proxy server — it has no Kubernetes client and
      # needs no API access. Use a dedicated ServiceAccount with no RBAC bindings
      # instead of inheriting 'default', and do not mount a token.
      serviceAccountName: {{ include "kube-workspaces.fullname" . }}-frontend
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.port }}
              name: http
          {{- if .Values.frontend.externalApiUrl }}
          env:
            - name: NEXT_PUBLIC_API_URL
              value: {{ .Values.frontend.externalApiUrl | quote }}
            - name: API_URL
              value: "http://{{ include "kube-workspaces.fullname" . }}-api.{{ .Release.Namespace }}.svc.cluster.local:80"
            - name: PROXY_URL
              value: "http://{{ include "kube-workspaces.fullname" . }}-proxy.{{ .Release.Namespace }}.svc.cluster.local:80"
          {{- else }}
          env:
            - name: API_URL
              value: "http://{{ include "kube-workspaces.fullname" . }}-api.{{ .Release.Namespace }}.svc.cluster.local:80"
            - name: PROXY_URL
              value: "http://{{ include "kube-workspaces.fullname" . }}-proxy.{{ .Release.Namespace }}.svc.cluster.local:80"
          {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kube-workspaces.fullname" . }}-frontend
  labels:
    {{- include "kube-workspaces.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "kube-workspaces.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
