{{- include "kube-workspaces.execution.validate" . -}}
{{- $executionMode := include "kube-workspaces.execution.storageMode" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kube-workspaces.fullname" . }}-api
  labels:
    {{- include "kube-workspaces.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if eq $executionMode "ephemeral" }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "kube-workspaces.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "kube-workspaces.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "kube-workspaces.serviceAccountName" . }}
      # The legacy auto-mounted token is replaced with an explicit projected one:
      # it is short-lived and auto-rotated rather than long-lived, and the mount
      # is intentional and auditable rather than implicit. See docs/security.md.
      automountServiceAccountToken: false
      {{- if ne $executionMode "disabled" }}
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
              name: http
            - containerPort: 9090
              name: monitoring
          env:
            {{- include "kube-workspaces.execution.env" . | nindent 12 }}
            - name: KW_MONITORING_PLATFORM
              value: {{ printf "%s/%s" .Release.Namespace .Release.Name | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KW_MONITORING_SELECTOR
              value: {{ printf "app.kubernetes.io/instance=%s" .Release.Name | quote }}
            - name: KW_MONITORING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.monitoring.existingSecret | default (printf "%s-monitoring" (include "kube-workspaces.fullname" .)) }}
                  key: token
                  optional: true
            - name: KW_PROMETHEUS_URL
              value: {{ .Values.monitoring.prometheusURL | quote }}
            {{- if .Values.monitoring.prometheusAuthSecret }}
            - name: KW_PROMETHEUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.monitoring.prometheusAuthSecret }}
                  key: token
            {{- end }}
            {{- if .Values.api.externalHost }}
            - name: EXTERNAL_HOST
              value: {{ .Values.api.externalHost | quote }}
            {{- end }}
            {{- if .Values.api.allowedOrigins }}
            - name: ALLOWED_ORIGINS
              value: {{ .Values.api.allowedOrigins | quote }}
            {{- end }}
            {{- if .Values.auth.enabled }}
            {{- if .Values.auth.callbackURL }}
            - name: AUTH_CALLBACK_URL
              value: {{ .Values.auth.callbackURL | quote }}
            {{- else if .Values.api.externalHost }}
            - name: AUTH_CALLBACK_URL
              value: "https://{{ .Values.api.externalHost }}/auth/callback"
            {{- end }}
            {{- end }}
            {{- if .Values.execution.qgaPilot.enabled }}
            - name: KW_EXECUTION_QGA_ENABLED
              value: "true"
            - name: KW_MANAGEMENT_GRANT_KEY_FILE
              value: /etc/kube-workspaces/qga-grant-signing/key
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            {{- if eq $executionMode "ephemeral" }}
            - name: execution-temporary
              mountPath: /var/run/kube-workspaces/execution
            {{- else if ne $executionMode "disabled" }}
            - name: execution-recording-key
              mountPath: /etc/kube-workspaces/execution-recording
              readOnly: true
            {{- if .Values.execution.storage.s3.caSecret }}
            - name: execution-storage-ca
              mountPath: /etc/kube-workspaces/execution-storage-ca
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if .Values.execution.qgaPilot.enabled }}
            - name: qga-grant-signing
              mountPath: /etc/kube-workspaces/qga-grant-signing
              readOnly: true
            {{- end }}
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        {{- if eq $executionMode "ephemeral" }}
        - name: execution-temporary
          emptyDir:
            sizeLimit: {{ .Values.execution.storage.ephemeral.sizeLimit | quote }}
        {{- else if ne $executionMode "disabled" }}
        - name: execution-recording-key
          secret:
            secretName: {{ .Values.execution.storage.encryption.existingSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.execution.storage.encryption.key | quote }}
                path: key
        {{- if .Values.execution.storage.s3.caSecret }}
        - name: execution-storage-ca
          secret:
            secretName: {{ .Values.execution.storage.s3.caSecret | quote }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        {{- end }}
        {{- if .Values.execution.qgaPilot.enabled }}
        - name: qga-grant-signing
          secret:
            secretName: {{ .Values.execution.qgaPilot.signingKey.existingSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.execution.qgaPilot.signingKey.key | quote }}
                path: key
        {{- end }}
        - name: kube-api-access
          projected:
            defaultMode: 420
            sources:
              # No audience is set deliberately. The API server then issues the
              # token for its own default audience, which is what client-go's
              # in-cluster config expects. Hardcoding one risks mismatching the
              # cluster issuer (kubernetes.default.svc vs
              # kubernetes.default.svc.cluster.local) and failing authentication.
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kube-workspaces.fullname" . }}-api
  labels:
    {{- include "kube-workspaces.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "kube-workspaces.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
