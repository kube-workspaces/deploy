apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kube-workspaces.fullname" . }}-api
  labels:
    {{- include "kube-workspaces.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kube-workspaces.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "kube-workspaces.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "kube-workspaces.serviceAccountName" . }}
      # The legacy auto-mounted token is replaced with an explicit projected one:
      # it is short-lived and auto-rotated rather than long-lived, and the mount
      # is intentional and auditable rather than implicit. See docs/security.md.
      automountServiceAccountToken: false
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
              name: http
          {{- if or .Values.api.externalHost .Values.api.allowedOrigins .Values.auth.enabled }}
          env:
            {{- if .Values.api.externalHost }}
            - name: EXTERNAL_HOST
              value: {{ .Values.api.externalHost | quote }}
            {{- end }}
            {{- if .Values.api.allowedOrigins }}
            - name: ALLOWED_ORIGINS
              value: {{ .Values.api.allowedOrigins | quote }}
            {{- end }}
            {{- if .Values.auth.enabled }}
            {{- if .Values.auth.callbackURL }}
            - name: AUTH_CALLBACK_URL
              value: {{ .Values.auth.callbackURL | quote }}
            {{- else if .Values.api.externalHost }}
            - name: AUTH_CALLBACK_URL
              value: "https://{{ .Values.api.externalHost }}/auth/callback"
            {{- end }}
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: kube-api-access
          projected:
            defaultMode: 420
            sources:
              # No audience is set deliberately. The API server then issues the
              # token for its own default audience, which is what client-go's
              # in-cluster config expects. Hardcoding one risks mismatching the
              # cluster issuer (kubernetes.default.svc vs
              # kubernetes.default.svc.cluster.local) and failing authentication.
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kube-workspaces.fullname" . }}-api
  labels:
    {{- include "kube-workspaces.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "kube-workspaces.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
