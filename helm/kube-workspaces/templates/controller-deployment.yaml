apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kube-workspaces.fullname" . }}-controller
  labels:
    {{- include "kube-workspaces.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "kube-workspaces.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "kube-workspaces.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ include "kube-workspaces.serviceAccountName" . }}
      # The legacy auto-mounted token is replaced with an explicit projected one:
      # it is short-lived and auto-rotated rather than long-lived, and the mount
      # is intentional and auditable rather than implicit. See docs/security.md.
      automountServiceAccountToken: false
      containers:
        - name: controller
          image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          args:
            - --leader-elect
            - --metrics-bind-address=:8080
            - --metrics-secure=false
          ports:
            - containerPort: 8081
              name: health
            - containerPort: 8080
              name: metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          volumeMounts:
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: kube-api-access
          projected:
            defaultMode: 420
            sources:
              # No audience is set deliberately. The API server then issues the
              # token for its own default audience, which is what client-go's
              # in-cluster config expects. Hardcoding one risks mismatching the
              # cluster issuer (kubernetes.default.svc vs
              # kubernetes.default.svc.cluster.local) and failing authentication.
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
