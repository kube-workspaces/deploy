{{- /*
  Optional KubeVirt installation for `spec.type: vm` workspaces.

  Renders the pinned upstream KubeVirt operator manifest (vendored verbatim in
  files/kubevirt-operator.yaml — Namespace, CRDs, RBAC and the virt-operator
  Deployment, all in the kubevirt namespace), then the KubeVirt CR that tells
  the operator to roll out the platform.

  The KubeVirt CR is an ordinary manifest, NOT a Helm hook: making it a
  before-hook-creation hook deletes and recreates the CR on every chart
  upgrade, which makes virt-operator tear down the whole platform (CRDs,
  virt-controller/handler, and every VirtualMachine). The CRD for the CR is
  rendered above in files/kubevirt-operator.yaml, so a fresh install applies
  cleanly in order.

  Uninstall note: disabling this flag removes the operator resources rendered
  here, but the workload CRDs (virtualmachines.kubevirt.io etc.) are created
  by virt-operator, not this chart, and are left behind.
*/ -}}
{{- if .Values.kubevirt.enabled }}
{{ .Files.Get "files/kubevirt-operator.yaml" }}
---
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  certificateRotateStrategy: {}
  configuration:
    developerConfiguration:
      # useEmulation runs guests without /dev/kvm (slow, fine for kind/CI).
      useEmulation: {{ .Values.kubevirt.useEmulation }}
      featureGates: []
    imagePullPolicy: IfNotPresent
  customizeComponents: {}
  imagePullPolicy: IfNotPresent
  workloadUpdateStrategy: {}
{{- if .Values.kubevirt.cdi.enabled }}
---
# Containerized Data Importer: the pinned upstream operator manifest
# (files/cdi-operator.yaml) plus the CDI CR that rolls out the importer,
# uploader, cloner and controller workloads into the cdi namespace.
# Required for persistentRootDisk images, which back the VM root disk with a
# DataVolume that CDI imports from the container disk image (registry source).
# Same uninstall caveat as KubeVirt: the cdi CRDs are created by cdi-operator
# and left behind when the flag is disabled.
{{ .Files.Get "files/cdi-operator.yaml" }}
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: CDI
metadata:
  name: cdi
  namespace: cdi
spec:
  imagePullPolicy: IfNotPresent
{{- end }}
{{- end }}
