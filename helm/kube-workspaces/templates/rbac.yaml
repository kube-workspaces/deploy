{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kube-workspaces.serviceAccountName" . }}
  labels:
    {{- include "kube-workspaces.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kube-workspaces.fullname" . }}-manager
  labels:
    {{- include "kube-workspaces.labels" . | nindent 4 }}
rules:
  - apiGroups: ["kubeworkspaces.io"]
    resources: ["workspaces", "workspaces/status", "workspaces/finalizers"]
    verbs: ["*"]
  - apiGroups: ["kubeworkspaces.io"]
    resources: ["images"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: ["kubeworkspaces.io"]
    resources: ["poddefaults"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kubeworkspaces.io"]
    resources: ["users", "users/status", "users/finalizers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kubeworkspaces.io"]
    resources: ["authconfigs", "authconfigs/status", "authconfigs/finalizers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kubeworkspaces.io"]
    resources: ["platformconfigs", "platformconfigs/status", "platformconfigs/finalizers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["services", "pods", "pods/log", "pods/exec", "events", "persistentvolumeclaims", "namespaces"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["*"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kube-workspaces.fullname" . }}-manager
  labels:
    {{- include "kube-workspaces.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kube-workspaces.fullname" . }}-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "kube-workspaces.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Local authentication support: the controller (bootstrap admin) and API
# (user/password admin CRUD) need to create, update, and delete the Secrets
# holding local users' bcrypt password hashes. These Secrets always live in
# the release namespace regardless of a user's personal namespace, so write
# access is scoped to this namespace only rather than added to the cluster-wide
# ClusterRole above (which keeps read-only access to Secrets everywhere else).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kube-workspaces.fullname" . }}-local-auth-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-workspaces.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kube-workspaces.fullname" . }}-local-auth-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-workspaces.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kube-workspaces.fullname" . }}-local-auth-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "kube-workspaces.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# When local auth is enabled, password Secrets may live in a separate system
# namespace (kube-workspaces-system) that is not the release namespace. Grant
# the same write access there so the API and controller can manage them.
{{- if and .Values.auth.enabled .Values.auth.localAuth .Values.auth.localAuth.enabled }}
{{- $systemNs := "kube-workspaces-system" }}
{{- if ne $systemNs .Release.Namespace }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kube-workspaces.fullname" . }}-local-auth-secrets
  namespace: {{ $systemNs }}
  labels:
    {{- include "kube-workspaces.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kube-workspaces.fullname" . }}-local-auth-secrets
  namespace: {{ $systemNs }}
  labels:
    {{- include "kube-workspaces.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kube-workspaces.fullname" . }}-local-auth-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "kube-workspaces.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
