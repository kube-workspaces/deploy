apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kube-workspaces.fullname" . }}-proxy
  labels:
    {{- include "kube-workspaces.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kube-workspaces.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: proxy
  template:
    metadata:
      labels:
        {{- include "kube-workspaces.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: proxy
    spec:
      serviceAccountName: {{ include "kube-workspaces.fullname" . }}-proxy
      containers:
        - name: proxy
          image: "{{ .Values.proxy.image.repository }}:{{ .Values.proxy.image.tag }}"
          imagePullPolicy: {{ .Values.proxy.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.proxy.port }}
              name: http
          env:
            {{- if .Values.proxy.allowedOrigins }}
            - name: ALLOWED_ORIGINS
              value: {{ .Values.proxy.allowedOrigins | quote }}
            {{- end }}
            - name: PATH_PREFIX
              value: {{ .Values.proxy.pathPrefix | default "/proxy" | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.proxy.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kube-workspaces.fullname" . }}-proxy
  labels:
    {{- include "kube-workspaces.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  type: {{ .Values.proxy.service.type | default "ClusterIP" }}
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "kube-workspaces.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kube-workspaces.fullname" . }}-proxy
  labels:
    {{- include "kube-workspaces.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kube-workspaces.fullname" . }}-proxy
  labels:
    {{- include "kube-workspaces.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
rules:
  - apiGroups: ["kubeworkspaces.io"]
    resources: ["images"]
    verbs: ["list"]
  - apiGroups: ["kubeworkspaces.io"]
    resources: ["workspaces"]
    verbs: ["get"]
  - apiGroups: ["kubeworkspaces.io"]
    resources: ["authconfigs"]
    verbs: ["get"]
  - apiGroups: ["kubeworkspaces.io"]
    resources: ["users"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kube-workspaces.fullname" . }}-proxy
  labels:
    {{- include "kube-workspaces.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kube-workspaces.fullname" . }}-proxy
subjects:
  - kind: ServiceAccount
    name: {{ include "kube-workspaces.fullname" . }}-proxy
    namespace: {{ .Release.Namespace }}
---
# Role for reading Secrets (signing key) in the release namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kube-workspaces.fullname" . }}-proxy-secrets
  labels:
    {{- include "kube-workspaces.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kube-workspaces.fullname" . }}-proxy-secrets
  labels:
    {{- include "kube-workspaces.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kube-workspaces.fullname" . }}-proxy-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "kube-workspaces.fullname" . }}-proxy
    namespace: {{ .Release.Namespace }}
