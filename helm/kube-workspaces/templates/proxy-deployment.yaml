apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kube-workspaces.fullname" . }}-proxy
  labels:
    {{- include "kube-workspaces.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kube-workspaces.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: proxy
  template:
    metadata:
      labels:
        {{- include "kube-workspaces.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: proxy
    spec:
      serviceAccountName: {{ include "kube-workspaces.fullname" . }}-proxy
      # The legacy auto-mounted token is replaced with an explicit projected one:
      # it is short-lived and auto-rotated rather than long-lived, and the mount
      # is intentional and auditable rather than implicit. See docs/security.md.
      automountServiceAccountToken: false
      containers:
        - name: proxy
          image: "{{ .Values.proxy.image.repository }}:{{ .Values.proxy.image.tag }}"
          imagePullPolicy: {{ .Values.proxy.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.proxy.port }}
              name: http
          env:
            {{- if .Values.proxy.allowedOrigins }}
            - name: ALLOWED_ORIGINS
              value: {{ .Values.proxy.allowedOrigins | quote }}
            {{- end }}
            - name: PATH_PREFIX
              value: {{ .Values.proxy.pathPrefix | default "/proxy" | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.proxy.resources | nindent 12 }}
          volumeMounts:
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: kube-api-access
          projected:
            defaultMode: 420
            sources:
              # No audience is set deliberately. The API server then issues the
              # token for its own default audience, which is what client-go's
              # in-cluster config expects. Hardcoding one risks mismatching the
              # cluster issuer (kubernetes.default.svc vs
              # kubernetes.default.svc.cluster.local) and failing authentication.
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kube-workspaces.fullname" . }}-proxy
  labels:
    {{- include "kube-workspaces.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  type: {{ .Values.proxy.service.type | default "ClusterIP" }}
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "kube-workspaces.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kube-workspaces.fullname" . }}-proxy
  labels:
    {{- include "kube-workspaces.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kube-workspaces.fullname" . }}-proxy
  labels:
    {{- include "kube-workspaces.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
rules:
  - apiGroups: ["kubeworkspaces.io"]
    resources: ["images"]
    verbs: ["list"]
  - apiGroups: ["kubeworkspaces.io"]
    resources: ["workspaces"]
    verbs: ["get"]
  - apiGroups: ["kubeworkspaces.io"]
    resources: ["authconfigs"]
    verbs: ["get"]
  - apiGroups: ["kubeworkspaces.io"]
    resources: ["users"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kube-workspaces.fullname" . }}-proxy
  labels:
    {{- include "kube-workspaces.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kube-workspaces.fullname" . }}-proxy
subjects:
  - kind: ServiceAccount
    name: {{ include "kube-workspaces.fullname" . }}-proxy
    namespace: {{ .Release.Namespace }}
---
# Role for reading Secrets (signing key) in the release namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kube-workspaces.fullname" . }}-proxy-secrets
  labels:
    {{- include "kube-workspaces.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kube-workspaces.fullname" . }}-proxy-secrets
  labels:
    {{- include "kube-workspaces.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kube-workspaces.fullname" . }}-proxy-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "kube-workspaces.fullname" . }}-proxy
    namespace: {{ .Release.Namespace }}
