{{- /*
  Render an Image CR per entry in .Values.images.

  Every key except "name" and "displayName" is passed through verbatim, so any
  field the Image CRD supports can be set from values.yaml without editing this
  template. Previously each field needed an explicit clause here, which silently
  dropped anything not listed (additionalPorts, tags, category, defaultUser, ...).
*/ -}}
{{- range .Values.images }}
{{- $name := required "each entry in .Values.images requires a 'name' (RFC 1123 compliant)" .name }}
---
apiVersion: kubeworkspaces.io/v1alpha1
kind: Image
metadata:
  name: {{ $name }}
spec:
  displayName: {{ default $name .displayName | quote }}
  {{- omit . "name" "displayName" | toYaml | nindent 2 }}
{{- end }}
