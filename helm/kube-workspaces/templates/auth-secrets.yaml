{{- if .Values.auth.enabled }}
{{- if .Values.auth.session.signingKey.create }}
{{- $secretName := .Values.auth.session.signingKey.secretName }}
{{- $secretKey  := .Values.auth.session.signingKey.secretKey }}
{{- /* Look up an existing Secret so helm upgrade does not rotate the key. */}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-workspaces.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
type: Opaque
data:
  {{- if .Values.auth.session.signingKey.value }}
  {{ $secretKey }}: {{ .Values.auth.session.signingKey.value | b64enc | quote }}
  {{- else if and $existing (index $existing.data $secretKey) }}
  {{- /* Preserve the existing key so sessions survive upgrades. */}}
  {{ $secretKey }}: {{ index $existing.data $secretKey | quote }}
  {{- else }}
  {{ $secretKey }}: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- end }}
---
{{- if .Values.auth.oidc.clientSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.auth.oidc.clientSecret.secretName }}
  labels:
    {{- include "kube-workspaces.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
type: Opaque
data:
  {{ .Values.auth.oidc.clientSecret.secretKey }}: {{ .Values.auth.oidc.clientSecret.value | b64enc | quote }}
{{- end }}
{{- end }}
