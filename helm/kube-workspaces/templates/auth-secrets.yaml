{{- if .Values.auth.enabled }}
{{- if .Values.auth.session.signingKey.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.auth.session.signingKey.secretName }}
  labels:
    {{- include "kube-workspaces.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
type: Opaque
data:
  {{- if .Values.auth.session.signingKey.value }}
  {{ .Values.auth.session.signingKey.secretKey }}: {{ .Values.auth.session.signingKey.value | b64enc | quote }}
  {{- else }}
  {{ .Values.auth.session.signingKey.secretKey }}: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- end }}
---
{{- if .Values.auth.oidc.clientSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.auth.oidc.clientSecret.secretName }}
  labels:
    {{- include "kube-workspaces.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
type: Opaque
data:
  {{ .Values.auth.oidc.clientSecret.secretKey }}: {{ .Values.auth.oidc.clientSecret.value | b64enc | quote }}
{{- end }}
{{- end }}
