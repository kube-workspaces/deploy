{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kube-workspaces.fullname" . }}
  labels:
    {{- include "kube-workspaces.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $host := .Values.ingress.hosts }}
    {{- /*
      Fail fast rather than rendering `paths:` with a null value. Overriding
      ingress.hosts via --set replaces the whole list, so it is easy to end up
      with a host and no paths; the API server rejects that with a type error
      that gives no hint about the cause.
    */ -}}
    {{- if not $host.paths }}
    {{- fail (printf "ingress.hosts entry %q has no 'paths' — each host requires at least one path (see values.yaml for the default set)" $host.host) }}
    {{- end }}
    - host: {{ $host.host | quote }}
      http:
        paths:
          {{- range $host.paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ .backend.serviceName }}
                port:
                  number: {{ .backend.servicePort }}
          {{- end }}
    {{- end }}
{{- end }}
