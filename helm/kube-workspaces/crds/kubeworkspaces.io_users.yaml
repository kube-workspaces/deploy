---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: users.kubeworkspaces.io
spec:
  group: kubeworkspaces.io
  names:
    kind: User
    listKind: UserList
    plural: users
    singular: user
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.email
      name: Email
      type: string
    - jsonPath: .spec.role
      name: Role
      type: string
    - jsonPath: .spec.disabled
      name: Disabled
      type: boolean
    - jsonPath: .status.personalNamespace
      name: Namespace
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          User is the Schema for the users API.
          It represents a user account in the kube-workspaces system.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: UserSpec defines the desired state of User.
            properties:
              disabled:
                description: Disabled indicates whether the user account is disabled.
                type: boolean
              displayName:
                description: DisplayName is the human-readable name of the user.
                type: string
              email:
                description: Email is the unique identifier for the user (immutable).
                format: email
                type: string
              groups:
                description: Groups are the groups this user belongs to.
                items:
                  type: string
                type: array
              localAuth:
                description: |-
                  LocalAuth configures local username/password authentication for this user.
                  May be set alongside other authentication methods (e.g. OIDC) for the same identity.
                properties:
                  enabled:
                    description: |-
                      Enabled controls whether this user may authenticate with a local password,
                      in addition to any other configured authentication method (e.g. OIDC).
                    type: boolean
                  mustChangePassword:
                    description: |-
                      MustChangePassword indicates the user must set a new password before
                      continuing to use the system. Set on creation/reset, cleared on change.
                    type: boolean
                  passwordSecretRef:
                    description: |-
                      PasswordSecretRef references the Secret and key holding the bcrypt password
                      hash for this user (key is conventionally "passwordHash").
                    properties:
                      key:
                        description: Key is the key within the secret.
                        type: string
                      name:
                        description: Name is the name of the secret.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                type: object
              namespaceAccess:
                description: NamespaceAccess defines additional shared namespace grants
                  beyond the personal namespace.
                items:
                  description: NamespaceAccessEntry defines access to an additional
                    shared namespace.
                  properties:
                    namespace:
                      description: Namespace is the target namespace name.
                      type: string
                    role:
                      allOf:
                      - enum:
                        - admin
                        - editor
                        - viewer
                      - enum:
                        - admin
                        - editor
                        - viewer
                      description: Role is the access level in this namespace.
                      type: string
                  required:
                  - namespace
                  - role
                  type: object
                type: array
              role:
                default: editor
                description: Role is the cluster-wide default role for this user.
                enum:
                - admin
                - editor
                - viewer
                type: string
            required:
            - email
            - role
            type: object
          status:
            description: UserStatus defines the observed state of User.
            properties:
              avatarURL:
                description: AvatarURL is the URL to the user's avatar image (from
                  OIDC or Gravatar).
                type: string
              conditions:
                description: Conditions represent the latest available observations
                  of the User's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              failedLoginAttempts:
                description: |-
                  FailedLoginAttempts is the number of consecutive failed local login attempts.
                  Reset to 0 on successful login.
                type: integer
              lastLogin:
                description: LastLogin is the timestamp of the user's last login.
                format: date-time
                type: string
              lockedUntil:
                description: |-
                  LockedUntil, if set and in the future, indicates local login is temporarily
                  disabled due to repeated failed attempts.
                format: date-time
                type: string
              loginCount:
                description: LoginCount is the number of times the user has logged
                  in.
                format: int64
                type: integer
              personalNamespace:
                description: PersonalNamespace is the name of the user's personal
                  namespace (if enabled).
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
