---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: platformconfigs.kubeworkspaces.io
spec:
  group: kubeworkspaces.io
  names:
    kind: PlatformConfig
    listKind: PlatformConfigList
    plural: platformconfigs
    singular: platformconfig
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.maintenance.enabled
      name: Maintenance
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PlatformConfig is the Schema for the platformconfigs API.
          It defines platform-wide configuration for kube-workspaces that is not related to authentication.
          Typically only one instance named "default" should exist.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PlatformConfigSpec defines the desired state of PlatformConfig.
            properties:
              agentUpgrades:
                description: |-
                  AgentUpgrades configures the administrator-only durable agent-upgrade
                  admission surface. Absent/false keeps agent upgrades disabled.
                properties:
                  enabled:
                    description: |-
                      Enabled admits administrator-only durable upgrade attempts when storage,
                      eligibility and reservation prerequisites are healthy.
                      Absent/false disables agent upgrades entirely.
                    type: boolean
                type: object
              form:
                description: Form configures workspace creation form behavior including
                  field locking.
                properties:
                  lockedFields:
                    description: |-
                      LockedFields lists form fields that non-admin users cannot modify.
                      Admins can always override locked fields.
                    items:
                      description: PlatformFormFieldLock defines a locked form field
                        with its enforced value.
                      properties:
                        field:
                          description: Field is the name of the form field to lock
                            (e.g. "image_pull_policy", "gpu", "shared_memory", "cpu_limit",
                            "memory_limit").
                          type: string
                        message:
                          description: Message is an optional hint displayed to users
                            explaining why the field is locked.
                          type: string
                        value:
                          description: |-
                            Value is the enforced value for the field. For boolean fields use "true"/"false".
                            For select fields use the option value. Empty string means use the default.
                          type: string
                      required:
                      - field
                      type: object
                    type: array
                type: object
              maintenance:
                description: Maintenance configures maintenance mode for the platform.
                properties:
                  enabled:
                    description: |-
                      Enabled controls whether maintenance mode is active.
                      When true, non-admin users see the maintenance page and cannot create/manage workspaces.
                    type: boolean
                  message:
                    description: |-
                      Message is an optional message displayed to users during maintenance.
                      Supports plain text. If empty, a default message is shown.
                    type: string
                type: object
              vmExecution:
                description: VMExecution configures opt-in agent-backed VM commands
                  and shells.
                properties:
                  allowElevated:
                    description: |-
                      AllowElevated permits separately authorized root/SYSTEM targets.
                      Absent/false denies elevated targets even for admins.
                    type: boolean
                  enabled:
                    description: |-
                      Enabled permits admission only when transport, recording and guest identity
                      prerequisites are healthy. Absent/false disables execution even for admins.
                    type: boolean
                type: object
              vmGPUProfiles:
                description: |-
                  VMGPUProfiles declares versioned render-only Windows GPU choices.
                  An absent/empty list permits only software Windows profiles.
                items:
                  description: |-
                    VMGPUProfile is an operator-declared, versioned render-only VM GPU contract.
                    Use a new ID for hardware/driver changes; existing workspace snapshots must
                    not be silently rewritten when platform configuration changes.
                  properties:
                    count:
                      description: Count is one device allocation. Multi-device Windows
                        profiles are not qualified.
                      format: int32
                      maximum: 1
                      minimum: 1
                      type: integer
                    displayName:
                      description: DisplayName is an operator-facing label, not a
                        support certification.
                      maxLength: 128
                      minLength: 1
                      type: string
                    experimental:
                      description: Experimental labels a research profile without
                        claiming vendor/product support.
                      type: boolean
                    guestDriverVersion:
                      description: |-
                        GuestDriverVersion identifies the separately provisioned Windows driver.
                        This field does not install a driver or assert that the guest is using it.
                      maxLength: 128
                      minLength: 1
                      type: string
                    id:
                      description: ID names this exact version of the profile.
                      maxLength: 63
                      pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                      type: string
                    kind:
                      description: Kind selects the KubeVirt PCI or mediated-device
                        allowlist.
                      enum:
                      - pci
                      - mediated
                      type: string
                    nodeSelector:
                      additionalProperties:
                        type: string
                      description: NodeSelector restricts the certified worker selected
                        for the Windows root.
                      minProperties: 1
                      type: object
                    resourceName:
                      description: ResourceName is the exact device-plugin extended
                        resource, not a /gpu heuristic.
                      maxLength: 253
                      type: string
                  required:
                  - count
                  - displayName
                  - experimental
                  - guestDriverVersion
                  - id
                  - kind
                  - nodeSelector
                  - resourceName
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - id
                x-kubernetes-list-type: map
            type: object
          status:
            description: PlatformConfigStatus defines the observed state of PlatformConfig.
            properties:
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              maintenanceActive:
                description: MaintenanceActive reflects whether maintenance mode is
                  currently active.
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
