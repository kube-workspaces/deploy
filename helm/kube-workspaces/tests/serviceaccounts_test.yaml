# Unit tests for ServiceAccount wiring.
#
# The frontend previously had no serviceAccountName at all, so it inherited
# 'default' and was handed an auto-mounted API token it has no use for: it has no
# Kubernetes client and makes no API-server calls.
suite: service accounts
templates:
  - frontend-deployment.yaml
  - controller-deployment.yaml
  - api-deployment.yaml
  - proxy-deployment.yaml
tests:
  - it: gives the frontend its own ServiceAccount
    template: frontend-deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-kube-workspaces-frontend

  - it: does not mount a token into the frontend pod
    template: frontend-deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: creates the frontend ServiceAccount with automount disabled
    template: frontend-deployment.yaml
    documentSelector:
      path: kind
      value: ServiceAccount
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kube-workspaces-frontend
      - equal:
          path: automountServiceAccountToken
          value: false

  # The components that genuinely need API access must keep it.
  - it: runs the controller under the release ServiceAccount
    template: controller-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-kube-workspaces

  - it: runs the api under the release ServiceAccount
    template: api-deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-kube-workspaces

  - it: runs the proxy under its own ServiceAccount
    template: proxy-deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-kube-workspaces-proxy

  # The components that need API access no longer rely on the legacy
  # auto-mounted token either: they mount an explicit projected one.
  - it: disables token automounting for the controller
    template: controller-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: mounts a complete projected token for the controller
    template: controller-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].name
          value: kube-api-access
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /var/run/secrets/kubernetes.io/serviceaccount
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].readOnly
          value: true
      # The three files client-go's in-cluster config expects.
      - equal:
          path: spec.template.spec.volumes[0].projected.sources[0].serviceAccountToken.path
          value: token
      - equal:
          path: spec.template.spec.volumes[0].projected.sources[1].configMap.items[0].path
          value: ca.crt
      - equal:
          path: spec.template.spec.volumes[0].projected.sources[2].downwardAPI.items[0].path
          value: namespace

  # Pinning an audience risks mismatching the cluster issuer and breaking auth;
  # omitting it lets the API server issue for its own default audience.
  - it: pins no audience on the projected token
    template: controller-deployment.yaml
    asserts:
      - isNull:
          path: spec.template.spec.volumes[0].projected.sources[0].serviceAccountToken.audience

  - it: keeps the token short-lived
    template: controller-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].projected.sources[0].serviceAccountToken.expirationSeconds
          value: 3600

  # The frontend mounts nothing at all, since it has no Kubernetes client.
  - it: gives the frontend no token volume whatsoever
    template: frontend-deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isNull:
          path: spec.template.spec.volumes
      - isNull:
          path: spec.template.spec.containers[0].volumeMounts
