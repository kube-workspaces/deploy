# Unit tests for _helpers.tpl naming and the namespace toggles.
#
# The namespace switches exist because Helm cannot adopt a namespace it did not
# create: installing into a pre-existing one fails with "invalid ownership
# metadata" unless createReleaseNamespace is turned off.
suite: naming and namespaces
templates:
  - namespaces.yaml
  - controller-deployment.yaml
tests:
  - it: creates both namespaces by default
    template: namespaces.yaml
    asserts:
      - hasDocuments:
          count: 2

  - it: creates no namespaces when the master switch is off
    template: namespaces.yaml
    set:
      namespaces.create: false
    asserts:
      - hasDocuments:
          count: 0

  # Needed when installing into a namespace managed elsewhere (e.g. by Argo CD).
  - it: can skip the release namespace but keep the workspace one
    template: namespaces.yaml
    set:
      namespaces.createReleaseNamespace: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: workspaces

  - it: can skip the workspace namespace but keep the release one
    template: namespaces.yaml
    set:
      namespaces.createWorkspaceNamespace: false
    asserts:
      - hasDocuments:
          count: 1

  - it: honours a custom workspace namespace name
    template: namespaces.yaml
    set:
      namespaces.createReleaseNamespace: false
      workspaceNamespace: team-a
    asserts:
      - equal:
          path: metadata.name
          value: team-a

  # Resource names are release-prefixed, which is why the RBAC comparison
  # against kustomize has to normalise them.
  - it: prefixes resource names with the release name
    template: controller-deployment.yaml
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kube-workspaces-controller

  - it: sets the standard recommended labels
    template: controller-deployment.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: kube-workspaces
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: controller

  - it: allows the image tag to be overridden
    template: controller-deployment.yaml
    set:
      controller.image.tag: v9.9.9
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/kube-workspaces/controller:v9.9.9

  - it: allows the pull policy to be overridden for local images
    template: controller-deployment.yaml
    set:
      controller.image.pullPolicy: IfNotPresent
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent
