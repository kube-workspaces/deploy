# Unit tests for the local-auth Secrets RBAC (Role/RoleBinding), scoped to the
# release namespace rather than added to the cluster-wide manager ClusterRole.
suite: rbac
templates:
  - rbac.yaml
tests:
  - it: creates a namespaced Role granting write access to Secrets
    documentSelector:
      path: kind
      value: Role
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kube-workspaces-local-auth-secrets
      - equal:
          path: metadata.namespace
          value: NAMESPACE
      - equal:
          path: rules[0].resources[0]
          value: secrets
      - contains:
          path: rules[0].verbs
          content: create
      - contains:
          path: rules[0].verbs
          content: delete

  - it: binds the Role to the shared service account
    documentSelector:
      path: kind
      value: RoleBinding
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kube-workspaces-local-auth-secrets
      - equal:
          path: roleRef.kind
          value: Role
      - equal:
          path: roleRef.name
          value: RELEASE-NAME-kube-workspaces-local-auth-secrets
      - equal:
          path: subjects[0].name
          value: RELEASE-NAME-kube-workspaces

  - it: does not grant cluster-wide Secret write access
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - equal:
          path: rules[8].resources[0]
          value: secrets
      - notContains:
          path: rules[8].verbs
          content: create
      - notContains:
          path: rules[8].verbs
          content: delete
