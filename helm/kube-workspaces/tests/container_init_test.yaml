suite: opt-in container-init installer configuration
templates:
  - controller-deployment.yaml
tests:
  - it: enables injection by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --container-init-image=ghcr.io/kube-workspaces/container-init
  - it: leaves injection disabled when configured empty
    set:
      controller.containerInitImage: ""
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["--leader-elect", "--metrics-bind-address=:8080", "--metrics-secure=false"]
  - it: passes the configured immutable installer reference
    set:
      controller.containerInitImage: ghcr.io/kube-workspaces/container-init:sha-example
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --container-init-image=ghcr.io/kube-workspaces/container-init:sha-example
