# Optional, operator-managed host render-node allocation. Not installed by Helm.
# Verify the selected node's device identity/driver before applying its opt-in label.
# This exposes the render node only, not display modesetting or VFIO devices.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: intel-render-device-plugin
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: intel-render-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intel-render-device-plugin
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
        kubeworkspaces.io/container-intel-gpu: "true"
      containers:
        - name: device-plugin
          image: ghcr.io/squat/generic-device-plugin:0.2.0@sha256:66c8d5c270eb2b721f1064c549b9b7898152a6d2f0163380a5d37dc7636c20ff
          args:
            - --domain=kubeworkspaces.io
            - --device
            - '{"name":"intel-render","groups":[{"count":1,"paths":[{"path":"/dev/dri/renderD128"}]}]}'
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: device-plugins
              mountPath: /var/lib/kubelet/device-plugins
            - name: dri
              mountPath: /dev/dri
              readOnly: true
      volumes:
        - name: device-plugins
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
